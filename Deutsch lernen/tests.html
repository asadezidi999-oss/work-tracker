function todayStr(){return new Date().toISOString().split('T')[0]}
function yesterday(){
  const d=new Date();d.setDate(d.getDate()-1);
  return d.toISOString().split('T')[0];
}
function diffLabel(d){return d==='easy'?'سهل':d==='medium'?'متوسط':'صعب'}
function scoreSpeech(said,target){
  const s=said.toLowerCase().trim();
  const t=target.toLowerCase().trim();
  let score=0;
  if(s===t)score=100;
  else{
    const sw=s.split(' ');const tw=t.split(' ');
    const matches=sw.filter(w=>tw.includes(w)).length;
    score=Math.round((matches/tw.length)*100);
    score=Math.max(20,Math.min(95,score));
  }
  return score;
}

// TEST RUNNER
// ═══════════════════════════════════════════════════
let tests = [];
let passed = 0;
let failed = 0;

function test(name, fn) {
  tests.push({ name, fn });
}

function assert(condition, msg = '') {
  if (!condition) throw new Error(msg || 'Assertion failed');
}
function assertEqual(actual, expected, msg = '') {
  if (actual !== expected) {
    throw new Error(`${msg} Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  }
}

function runTests() {
  const resultsEl = document.getElementById('results');
  
  tests.forEach(t => {
    const div = document.createElement('div');
    div.className = 'test';
    
    const iconSpan = document.createElement('span');
    iconSpan.className = 'icon';
    
    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    nameSpan.textContent = t.name;
    
    const detailDiv = document.createElement('div');
    detailDiv.className = 'detail';
    
    try {
      t.fn();
      iconSpan.textContent = '✅';
      div.classList.add('pass');
      passed++;
    } catch (e) {
      iconSpan.textContent = '❌';
      div.classList.add('fail');
      detailDiv.textContent = e.message || e;
      failed++;
    }
    
    div.appendChild(iconSpan);
    div.appendChild(nameSpan);
    div.appendChild(detailDiv);
    resultsEl.appendChild(div);
  });
  
  document.getElementById('total-count').textContent = tests.length;
  document.getElementById('pass-count').textContent = passed;
  document.getElementById('fail-count').textContent = failed;
}

const SM2 = {
  getDue(sm2data){
    const today = new Date().toISOString().split('T')[0];
    return VOCAB.filter(w => {
      const c = sm2data[w.id];
      return c && c.history && c.history.length > 0 && c.nextReview <= today;
    });
  },
  getDueCount(sm2data){return this.getDue(sm2data).length;}
};

test('Due-cards: new user with empty sm2Data returns 0', () => {
  assertEqual(SM2.getDueCount({}), 0);
});

test('Due-cards: user with reviewed cards due today returns count', () => {
  const today = new Date().toISOString().split('T')[0];
  const data = {
    1: {ef:2.5,interval:1,repetitions:1,nextReview:today,history:[{date:today,quality:3}]}
  };
  assertEqual(SM2.getDueCount(data), 1);
});

test('Due-cards: cards with future review date not counted', () => {
  const future = '2099-12-31';
  const data = {
    1: {ef:2.5,interval:30,repetitions:3,nextReview:future,history:[{date:'2026-01-01',quality:5}]},
    2: {ef:2.5,interval:1,repetitions:1,nextReview:'2026-01-01',history:[{date:'2026-01-01',quality:3}]}
  };
  // Only id:2 (past date) should be due; id:1 (future) should not
  const result = SM2.getDue(data);
  assertEqual(result.length, 1);
  assertEqual(result[0].id, 2);
});

test('Due-cards: cards with history but no nextReview not counted', () => {
  const data = {
    1: {ef:2.5,interval:0,repetitions:0,nextReview:'',history:[]}
  };
  assertEqual(SM2.getDueCount(data), 0);
});

test('B1: unlock condition requires all A2 lessons', () => {
  function a2complete(completed){
    return LESSONS.a2.every(l => completed.includes(l.id));
  }
  // No A2 completed → locked
  assert(!a2complete([]));
  // Only some A2 completed → locked  
  assert(!a2complete(['a2-1','a2-2']));
  // All A2 completed → unlocked
  assert(a2complete(['a2-1','a2-2','a2-3','a2-4','a2-5','a2-6','a2-7','a2-8','a2-9','a2-10']));
});

test('generateQuiz returns correct number of questions', () => {
  // Simulate the quiz generation logic
  const QUIZ_TYPES = ['mc','match','fill','listen'];
  const pool = [...VOCAB].sort(() => Math.random()-0.5).slice(0, 10);
  const questions = pool.map((w,i) => {
    const type = QUIZ_TYPES[i % QUIZ_TYPES.length];
    return {word:w, type};
  });
  assertEqual(questions.length, 10);
  questions.forEach((q, i) => {
    assert(q.word, `Question ${i} missing word`);
    assert(QUIZ_TYPES.includes(q.type), `Question ${i} has invalid type '${q.type}'`);
  });
});
