    </div>

    <!-- Rest bar -->
    <div id="rest-bar" class="rest-bar glass hidden">
      <span id="rest-bar-label" style="font-size:13px;font-weight:600;">Rest Timer</span>
      <span id="rest-bar-time" style="font-size:13px;font-weight:800;">00:00</span>
      <button class="rest-bar-close" id="rest-bar-close">✕</button>
    </div>

    <!-- Toast root -->
    <div id="toast-root" class="toast-root"></div>
  </div>

  <script type="module">
    /* ================================================================
       CONSTANTS
       ================================================================ */
    const STORAGE_KEY = "emerald-gym-v2";
    const SPLIT_TYPES = /** @type {const} */ (["push","pull","legs"]);
    const uid = () => {
      if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    };
    const safeNumber = (value, fallback = 0) => {
      const next = Number(value);
      return Number.isFinite(next) ? next : fallback;
    };
    const renderIcons = () => {
      globalThis.lucide?.createIcons?.({ nameAttr:"data-lucide" });
    };

    /* ================================================================
       IMAGE ASSETS
       ================================================================ */
    const IMAGES = {
      hero:        { src:"/images/hero-athlete-back.jpg",       alt:"Athlete back pose", w:1600, h:1066 },
      push:        { src:"/images/push-workout-athlete.jpg",    alt:"Push workout",      w:1600, h:1066 },
      pull:        { src:"/images/pull-workout-athlete.jpg",    alt:"Pull workout",      w:1600, h:1066 },
      legs:        { src:"/images/leg-day-athlete.jpg",         alt:"Leg day",           w:1600, h:1066 },
      motivation:  { src:"/images/motivation-card-image.jpg",   alt:"Motivation",        w:1600, h:1066 },
      restBg:      { src:"/images/rest-timer-background.jpg",   alt:"Rest timer",        w:1600, h:1066 },
      progress:    { src:"/images/hero-athlete-back.jpg",       alt:"Progress",          w:1600, h:1066 },
      recovery:    { src:"/images/recovery-background.jpg",     alt:"Recovery",          w:1600, h:1066 },
      bench:       { src:"/images/bench-press-athlete.jpg",     alt:"Bench press",       w:1600, h:1066 },
      squat:       { src:"/images/squat-scene.jpg",             alt:"Squat",             w:1600, h:1066 },
      deadlift:    { src:"/images/deadlift-scene.jpg",          alt:"Deadlift",          w:1600, h:1066 },
    };

    function mediaImg(asset, opts = {}) {
      if (!asset?.src) return "";
      const fp  = opts.fetchpriority ? ` fetchpriority="${opts.fetchpriority}"` : "";
      const laz = opts.loading || "lazy";
      return `<div class="media-fill"><img src="${asset.src}" alt="${asset.alt||""}" loading="${laz}" decoding="async"${fp} width="${asset.w||1600}" height="${asset.h||1066}" /></div>`;
    }

    function workoutImg(type = "push") {
      const t = String(type).toLowerCase();
      if (t.includes("pull")) return IMAGES.pull;
      if (t.includes("leg"))  return IMAGES.legs;
      return IMAGES.push;
    }

    function exerciseImg(name = "") {
      const n = name.toLowerCase();
      if (n.includes("bench"))   return IMAGES.bench;
      if (n.includes("squat"))   return IMAGES.squat;
      if (n.includes("deadlift"))return IMAGES.deadlift;
      if (n.includes("pull") || n.includes("row") || n.includes("curl")) return IMAGES.pull;
      if (n.includes("press") || n.includes("fly") || n.includes("push")) return IMAGES.push;
      return IMAGES.bench;
    }

    /* ================================================================
       EXERCISE DATABASE
       ================================================================ */
    const EXERCISE_DB = [
      { id:"ex-bench",     name:"Bench Press",           muscleGroup:"Chest",     secondaryMuscles:["Triceps","Front Delts"], equipment:"Barbell",   type:"compound", tags:["push"] },
      { id:"ex-incline-db",name:"Incline Dumbbell Press",muscleGroup:"Chest",     secondaryMuscles:["Shoulders","Triceps"],   equipment:"Dumbbell",  type:"compound", tags:["push"] },
      { id:"ex-shoulder",  name:"Shoulder Press",        muscleGroup:"Shoulders", secondaryMuscles:["Triceps"],               equipment:"Barbell",   type:"compound", tags:["push"] },
      { id:"ex-cable-fly", name:"Cable Fly",             muscleGroup:"Chest",     secondaryMuscles:[],                        equipment:"Cable",     type:"isolation",tags:["push"] },
      { id:"ex-pushdown",  name:"Triceps Pushdown",      muscleGroup:"Arms",      secondaryMuscles:[],                        equipment:"Cable",     type:"isolation",tags:["push"] },
      { id:"ex-row",       name:"Barbell Row",           muscleGroup:"Back",      secondaryMuscles:["Biceps"],                equipment:"Barbell",   type:"compound", tags:["pull"] },
      { id:"ex-pulldown",  name:"Lat Pulldown",          muscleGroup:"Back",      secondaryMuscles:["Biceps"],                equipment:"Machine",   type:"compound", tags:["pull"] },
      { id:"ex-seated-row",name:"Seated Row",            muscleGroup:"Back",      secondaryMuscles:["Rear Delts"],            equipment:"Cable",     type:"compound", tags:["pull"] },
      { id:"ex-face-pull", name:"Face Pull",             muscleGroup:"Shoulders", secondaryMuscles:["Rear Delts"],            equipment:"Cable",     type:"isolation",tags:["pull"] },
      { id:"ex-hammer",    name:"Hammer Curl",           muscleGroup:"Arms",      secondaryMuscles:[],                        equipment:"Dumbbell",  type:"isolation",tags:["pull"] },
      { id:"ex-squat",     name:"Squat",                 muscleGroup:"Legs",      secondaryMuscles:["Glutes","Core"],         equipment:"Barbell",   type:"compound", tags:["legs"] },
      { id:"ex-leg-press", name:"Leg Press",             muscleGroup:"Legs",      secondaryMuscles:["Glutes"],                equipment:"Machine",   type:"compound", tags:["legs"] },
      { id:"ex-rdl",       name:"Romanian Deadlift",     muscleGroup:"Legs",      secondaryMuscles:["Glutes","Lower Back"],   equipment:"Barbell",   type:"compound", tags:["legs"] },
      { id:"ex-leg-curl",  name:"Leg Curl",              muscleGroup:"Legs",      secondaryMuscles:[],                        equipment:"Machine",   type:"isolation",tags:["legs"] },
      { id:"ex-calf",      name:"Calf Raise",            muscleGroup:"Legs",      secondaryMuscles:[],                        equipment:"Machine",   type:"isolation",tags:["legs"] },
    ];

    const TEMPLATE_DEFAULTS = {
      push: { icon:"Flame",    color:"#10b981", exercises:["Bench Press","Incline Dumbbell Press","Shoulder Press","Cable Fly","Triceps Pushdown"] },
      pull: { icon:"Shield",   color:"#3b82f6", exercises:["Barbell Row","Lat Pulldown","Seated Row","Face Pull","Hammer Curl"] },
      legs: { icon:"Dumbbell", color:"#f59e0b", exercises:["Squat","Leg Press","Romanian Deadlift","Leg Curl","Calf Raise"] },
    };

    /* ================================================================
       I18N
       ================================================================ */
    const I18N = {
      de: {
        "nav.home":"Home","nav.workout":"Workouts","nav.stats":"Fortschritt","nav.settings":"Einstellungen",
        "home.greeting":"Guten Morgen, Leon 👋","home.title":"Trainiere smarter.<br/>Werde stärker.",
        "home.nextWorkout":"Nächstes Workout","home.quickAccess":"Schnellzugriff",
        "home.plan":"Trainingsplan","home.exercises":"Übungen","home.progress":"Fortschritt",
        "home.nutrition":"Ernährung","home.recovery":"Regeneration","home.calendar":"Kalender",
        "home.motivation":"Motivation","home.quote":"Heute ist ein guter Tag, stärker als gestern zu werden.",
        "hero.ready":"Bereit, deine Ziele zu erreichen?","hero.dayStreak":"Tage-Serie",
        "hero.weeklyVol":"Wochenvolumen","hero.progress":"Fortschritt",
        "workout.pushDay":"Push Day","workout.none":"Noch keine Übungen.",
        "workout.create":"Workout erstellen","workout.start":"Workout starten",
        "workout.exercises":"Übungen","workout.sets":"Sätze",
        "settings.title":"Einstellungen","settings.subtitle":"Kontrollzentrum für deine Fitness-App",
        "settings.appearance":"Darstellung","settings.language":"Sprache",
        "settings.haptics":"Haptik","settings.sound":"Sound",
        "settings.notifications":"Benachrichtigungen","settings.defaultRest":"Standard-Pause",
        "settings.export":"Datenexport","settings.backup":"Backup",
        "settings.import":"Backup importieren","settings.about":"Info","settings.reset":"Zurücksetzen",
        "values.dark":"Dark","values.light":"Light","values.on":"An","values.off":"Aus",
        "values.open":"Öffnen","values.create":"Erstellen","values.restore":"Wiederherstellen",
        "stats.sub":"Trainingsverteilung basierend auf deinem Verlauf","stats.topEx":"Top-Übungen",
      },
      en: {
        "nav.home":"Home","nav.workout":"Workouts","nav.stats":"Progress","nav.settings":"Settings",
        "home.greeting":"Good Morning, Leon 👋","home.title":"Train Smarter.<br/>Get Stronger.",
        "home.nextWorkout":"Next Workout","home.quickAccess":"Quick Access",
        "home.plan":"Training Plan","home.exercises":"Exercises","home.progress":"Progress",
        "home.nutrition":"Nutrition","home.recovery":"Recovery","home.calendar":"Calendar",
        "home.motivation":"Motivation","home.quote":"Today is a good day to become stronger than yesterday.",
        "hero.ready":"Ready to reach your goals?","hero.dayStreak":"Day Streak",
        "hero.weeklyVol":"Weekly Volume","hero.progress":"Progress",
        "workout.pushDay":"Push Day","workout.none":"No exercises yet.",
        "workout.create":"Create Workout","workout.start":"Start Workout",
        "workout.exercises":"Exercises","workout.sets":"Sets",
        "settings.title":"Settings","settings.subtitle":"Control center for your fitness app",
        "settings.appearance":"Appearance","settings.language":"Language",
        "settings.haptics":"Haptics","settings.sound":"Sound",
        "settings.notifications":"Notifications","settings.defaultRest":"Default Rest",
        "settings.export":"Export Data","settings.backup":"Backup",
        "settings.import":"Import Backup","settings.about":"About","settings.reset":"Reset",
        "values.dark":"Dark","values.light":"Light","values.on":"On","values.off":"Off",
        "values.open":"Open","values.create":"Create","values.restore":"Restore",
        "stats.sub":"Training distribution based on your workout history","stats.topEx":"Top exercises",
      },
    };
    const getLang = () => APP_STATE.data?.preferences?.language === "en" ? "en" : "de";
    const t = (k, vars = {}) => {
      const lang = getLang();
      const tmpl = I18N[lang]?.[k] || I18N.de[k] || k;
      return tmpl.replace(/\{(\w+)\}/g, (_,n) => String(vars[n]??""));
    };
    const numLocale = () => getLang() === "en" ? "en-US" : "de-DE";

    /* ================================================================
       DEFAULT STATE
       ================================================================ */
    const mkTemplates = () => SPLIT_TYPES.map(type => ({
      id: uid(),
      name: { push:"Push Day", pull:"Pull Day", legs:"Leg Day" }[type],
      icon: TEMPLATE_DEFAULTS[type].icon,
      color: TEMPLATE_DEFAULTS[type].color,
      type,
      favorite: type === "push",
      exercises: [...TEMPLATE_DEFAULTS[type].exercises],
      createdAt: Date.now(),
    }));

    const defaultState = () => ({
      workouts: [],
      streak: { current:0, best:0, lastDate:null },
      preferences: {
        theme:"dark", language:"de", haptics:true, sound:false,
        notifications:"default", defaultRestSeconds:120,
      },
      workoutTemplates: mkTemplates(),
      exerciseDatabase: EXERCISE_DB,
      prs: [],
      recovery: { byMuscle:{} },
      stats: null,
      _version: 2,
    });

    /* ================================================================
       STATE
       ================================================================ */
    const APP_STATE = { data: defaultState(), today: null };

    /* ================================================================
       STORAGE
       ================================================================ */
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        // Migration: if old version had exercises on workouts, keep them
        APP_STATE.data = deepMerge(defaultState(), parsed);
        normalizePrefs();
        normalizeTemplates();
      } catch(e) {
        console.warn("State load error", e);
      }
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(APP_STATE.data)); }
      catch(e) { console.warn("State save error", e); }
    }

    function deepMerge(base, override) {
      const out = { ...base };
      for (const k of Object.keys(override)) {
        if (override[k] && typeof override[k] === "object" && !Array.isArray(override[k]) && k in base && typeof base[k] === "object" && !Array.isArray(base[k])) {
          out[k] = deepMerge(base[k], override[k]);
        } else if (override[k] !== undefined) {
          out[k] = override[k];
        }
      }
      return out;
    }

    function normalizePrefs() {
      const p = APP_STATE.data.preferences;
      const safeRest = Number(p.defaultRestSeconds);
      APP_STATE.data.preferences = {
        theme: p.theme === "light" ? "light" : "dark",
        language: p.language === "en" ? "en" : "de",
        haptics: typeof p.haptics === "boolean" ? p.haptics : true,
        sound: typeof p.sound === "boolean" ? p.sound : false,
        notifications: ["default","granted","denied"].includes(p.notifications) ? p.notifications : "default",
        defaultRestSeconds: Number.isFinite(safeRest) && safeRest > 0 ? safeRest : 120,
      };
    }

    function normalizeTemplates() {
      const data = APP_STATE.data;
      if (!Array.isArray(data.workoutTemplates) || !data.workoutTemplates.length) {
        data.workoutTemplates = mkTemplates();
        return;
      }
      data.workoutTemplates = data.workoutTemplates.map(t => {
        const type = SPLIT_TYPES.includes(t?.type) ? t.type : "push";
        const def  = TEMPLATE_DEFAULTS[type];
        return {
          id:        t?.id || uid(),
          name:      t?.name || def.name || "Workout",
          icon:      t?.icon || def.icon,
          color:     t?.color || def.color,
          type,
          favorite:  Boolean(t?.favorite),
          exercises: Array.isArray(t?.exercises) && t.exercises.length ? t.exercises : [...def.exercises],
          createdAt: Number(t?.createdAt) || Date.now(),
        };
      });
    }

    /* ================================================================
       DATE HELPERS
       ================================================================ */
    const todayKey  = () => new Date().toISOString().slice(0,10);

    /* ================================================================
       ONBOARDING: A workout is "real" if it has at least one exercise
       with at least one set done — OR if completed is explicitly true.
       hasAnyRealActivity = true only when user has actually done something.
       ================================================================ */
    function hasAnyRealActivity() {
      return APP_STATE.data.workouts.some(w =>
        w.completed === true ||
        (Array.isArray(w.exercises) && w.exercises.some(ex =>
          Array.isArray(ex.setsData) && ex.setsData.some(s => s.done)
        ))
      );
    }

    function hasAnyExercisesAdded() {
      return APP_STATE.data.workouts.some(w =>
        Array.isArray(w.exercises) && w.exercises.length > 0
      );
    }

    /* ================================================================
       SET / EXERCISE HELPERS
       ================================================================ */
    function createSet({ reps=8, weight=80, rir=null } = {}) {
      return {
        id:          uid(),
        reps:        safeNumber(reps, 8),
        weight:      safeNumber(weight, 0),
        rir,
        restSeconds: APP_STATE.data.preferences.defaultRestSeconds || 120,
        isPR:        false,
        note:        "",
        done:        false,
      };
    }

    function normalizeSet(s = {}) {
      return {
        ...createSet(),
        ...s,
        id:          s.id || uid(),
        reps:        safeNumber(s.reps, 8),
        weight:      safeNumber(s.weight, 0),
        restSeconds: safeNumber(s.restSeconds, APP_STATE.data.preferences.defaultRestSeconds || 120),
        done:        Boolean(s.done ?? s.completed ?? false),
      };
    }

    function normalizeExercise(ex = {}) {
      if (!Array.isArray(ex.setsData) || !ex.setsData.length) {
        const n = Math.max(1, safeNumber(ex.sets, 3));
        ex.setsData = Array.from({length:n}, () => createSet({ reps: safeNumber(ex.reps, 8), weight: safeNumber(ex.weight, 0) }));
      }
      ex.setsData = ex.setsData.map(normalizeSet);
      return ex;
    }

    const getSets   = ex => ex.setsData?.length || 0;
    const getReps   = ex => (ex.setsData?.find(s=>!s.done)||ex.setsData?.[0])?.reps || 0;
    const getWeight = ex => (ex.setsData?.find(s=>!s.done)||ex.setsData?.[0])?.weight || 0;
    const isDone    = ex => Boolean(ex.setsData?.length) && ex.setsData.every(s=>s.done);

    function estimate1RM(w, r) {
      if (r <= 0 || w <= 0) return 0;
      return Math.round(w * (1 + Math.min(r,15) / 30)); // clamp reps for accuracy
    }

    /* ================================================================
       TODAY WORKOUT
       ================================================================ */
    function ensureTodayWorkout() {
      const key = todayKey();
      let today = APP_STATE.data.workouts.find(w => w.date === key);
      if (!today) {
        today = { id: uid(), date: key, label: "Push Day", exercises: [], notes:"", volume:0, score:0, completed:false, startedAt:null, completedAt:null };
        APP_STATE.data.workouts.push(today);
        saveState();
      }
      // Normalize all workouts
      let dirty = false;
      for (const w of APP_STATE.data.workouts) {
        const before = JSON.stringify(w.exercises);
        w.exercises = (w.exercises||[]).map(normalizeExercise);
        if (JSON.stringify(w.exercises) !== before) dirty = true;
        const vol = calcVol(w);
        if (w.volume !== vol) { w.volume = vol; dirty = true; }
      }
      if (dirty) saveState();
      APP_STATE.today = today;
    }

    function calcVol(workout) {
      return (workout.exercises||[]).reduce((t,ex) =>
        t + (ex.setsData||[]).reduce((s,set) => s + (set.reps*set.weight), 0), 0);
    }

    function calcScore(workout) {
      return Math.round((workout.exercises||[]).reduce((t,ex) => t + scoreEx(ex), 0));
    }

    function scoreEx(ex) {
      const vol = (ex.setsData||[]).reduce((s,set)=>s+(set.reps||0)*(set.weight||0),0);
      return vol * intensityMult(ex) * diffMult(ex.name);
    }

    function diffMult(name) {
      const n = String(name||"").toLowerCase();
      if (/squat|deadlift|bench|overhead press|row|pull.?up|chin|clean|snatch|rdl|sumo/.test(n)) return 1.3;
      if (/dip|lunge|incline|decline|hip|pushdown|step.?up/.test(n)) return 1.15;
      return 1.0;
    }

    function intensityMult(ex) {
      const prs = (APP_STATE.data.prs||[]).filter(p=>p.exerciseId===ex?.id);
      const bestPR = prs.reduce((b,p)=>Math.max(b,p.estimated1RM||0),0);
      if (!bestPR) return 0.85;
      const cur = (ex.setsData||[]).reduce((b,s)=>Math.max(b,estimate1RM(s.weight||0,s.reps||0)),0);
      return cur ? Math.max(0.5,Math.min(1.5,cur/bestPR)) : 0.85;
    }

    function recalcWorkout(w) {
      w.volume = calcVol(w);
      w.score  = calcScore(w);
    }

    function getWorkoutDurationMinutes(workout) {
      const start = Number(workout?.startedAt || workout?.createdAt || 0);
      const end = Number(workout?.completedAt || Date.now());
      if (!start || !end || end < start) return 0;
      return Math.max(1, Math.round((end - start) / 60000));
    }

    function getWorkoutPRs(workout) {
      const date = workout?.date;
      const ids = new Set((workout?.exercises || []).map(ex => ex.id));
      return (APP_STATE.data.prs || []).filter(pr => pr.date === date && ids.has(pr.exerciseId));
    }

    function summarizeWorkout(workout) {
      recalcWorkout(workout);
      const progress = getSetProgress(workout);
      const groups = inferGroups(workout);
      const prs = getWorkoutPRs(workout);
      return {
        date: workout.date,
        label: workout.label || "Workout",
        exercises: (workout.exercises || []).length,
        sets: progress.total,
        doneSets: progress.done,
        volume: Math.round(workout.volume || 0),
        score: Math.round(workout.score || 0),
        duration: getWorkoutDurationMinutes(workout),
        groups,
        prs
      };
    }

    function markWorkoutStarted(workout) {
      if (!workout.startedAt) {
        workout.startedAt = Date.now();
        saveState();
      }
    }

    function completeWorkout(workout) {
      if (!workout || !(workout.exercises || []).length) {
        showToast("Keine Übungen im Workout");
        return null;
      }
      const wasCompleted = Boolean(workout.completed);
      workout.completed = true;
      workout.completedAt = workout.completedAt || Date.now();
      workout.startedAt = workout.startedAt || workout.completedAt;
      recalcWorkout(workout);
      workout.summary = summarizeWorkout(workout);
      updateRecovery(workout);
      if (!wasCompleted) updateStreak(workout.date);
      recalcStats();
      saveState();
      return workout.summary;
    }

    function getExerciseHistory(exerciseName, beforeDate = todayKey()) {
      return (APP_STATE.data.workouts || [])
        .filter(w => w.date < beforeDate && Array.isArray(w.exercises))
        .flatMap(w => w.exercises
          .filter(ex => ex.name === exerciseName)
          .map(ex => ({ ...ex, workoutDate: w.date, workoutLabel: w.label || "Workout" }))
        )
        .sort((a,b) => String(b.workoutDate).localeCompare(String(a.workoutDate)));
    }

    function getOverloadSuggestion(ex, workoutDate = todayKey()) {
      const previous = getExerciseHistory(ex.name, workoutDate)[0];
      if (!previous) {
        return {
          title: "Progression",
          copy: "Erstes Tracking. Halte saubere Technik und notiere dein Ausgangsniveau."
        };
      }

      const prevSets = previous.setsData || [];
      const curSets = ex.setsData || [];
      const prevBest = prevSets.reduce((best,set) => {
        const est = estimate1RM(set.weight || 0, set.reps || 0);
        return est > best.est ? { est, weight:set.weight || 0, reps:set.reps || 0 } : best;
      }, { est:0, weight:0, reps:0 });
      const curNext = curSets.find(s => !s.done) || curSets[0] || { reps:8, weight:0 };
      const sameOrHigherWeight = Number(curNext.weight || 0) >= Number(prevBest.weight || 0);
      const repTarget = sameOrHigherWeight ? Number(prevBest.reps || curNext.reps || 8) + 1 : Number(curNext.reps || 8);
      const weightTarget = sameOrHigherWeight && Number(curNext.reps || 0) >= Number(prevBest.reps || 0)
        ? Number(prevBest.weight || curNext.weight || 0) + 2.5
        : Number(curNext.weight || prevBest.weight || 0);

      return {
        title: "Progressive Overload",
        copy: `Letztes Mal ${prevBest.weight} kg x ${prevBest.reps}. Ziel heute: ${weightTarget} kg x ${repTarget}.`
      };
    }

    /* ================================================================
       STATS RECALC
       ================================================================ */
    function recalcStats() {
      const workouts = APP_STATE.data.workouts || [];
      const today    = new Date();
      const wkStart  = new Date(today); wkStart.setDate(today.getDate()-6);

      const weekWks = workouts.filter(w=>{ const d=new Date(w.date); return d>=wkStart&&d<=today; });
      const weekVol = weekWks.reduce((a,w)=>a+(w.volume||0),0);
      const weekScr = weekWks.reduce((a,w)=>a+(w.score||0),0);
      const weekSes = weekWks.filter(w=>w.completed||w.exercises?.length).length;

      APP_STATE.data.stats = {
        weeklyVolumeKg:  +(weekVol/1000).toFixed(1),
        weeklySessions:  weekSes,
        weeklyScore:     Math.round(weekScr),
        weeklyPRs:       (APP_STATE.data.prs||[]).length,
        weeklySeries:    buildWeekSeries(workouts),
        monthlySeries:   buildMonthSeries(workouts),
        weeklyScoreSeries:  buildWeekScoreSeries(workouts),
        monthlyScoreSeries: buildMonthScoreSeries(workouts),
      };
    }

    function buildWeekSeries(wks) {
      const today = new Date();
      return Array.from({length:7},(_,i)=>{
        const d=new Date(today); d.setDate(today.getDate()-(6-i));
        const k=d.toISOString().slice(0,10);
        return (wks.find(w=>w.date===k)?.volume)||0;
      });
    }

    function buildMonthSeries(wks) {
      const today=new Date(), y=today.getFullYear(), m=today.getMonth();
      const days=new Date(y,m+1,0).getDate();
      return Array.from({length:days},(_,i)=>{
        const k=`${y}-${String(m+1).padStart(2,"0")}-${String(i+1).padStart(2,"0")}`;
        return (wks.find(w=>w.date===k)?.volume)||0;
      });
    }

    function buildWeekScoreSeries(wks) {
      const today=new Date();
      return Array.from({length:7},(_,i)=>{
        const d=new Date(today); d.setDate(today.getDate()-(6-i));
        const k=d.toISOString().slice(0,10);
        return (wks.find(w=>w.date===k)?.score)||0;
      });
    }

    function buildMonthScoreSeries(wks) {
      const today=new Date(), y=today.getFullYear(), m=today.getMonth();
      const days=new Date(y,m+1,0).getDate();
      return Array.from({length:days},(_,i)=>{
        const k=`${y}-${String(m+1).padStart(2,"0")}-${String(i+1).padStart(2,"0")}`;
        return (wks.find(w=>w.date===k)?.score)||0;
      });
    }

    /* ================================================================
       STREAK
       ================================================================ */
    function updateStreak(dateStr) {
      const s = APP_STATE.data.streak;
      if (!s.lastDate) { s.current = 1; }
      else {
        const diff = (new Date(dateStr)-new Date(s.lastDate))/(1000*60*60*24);
        s.current = diff===1 ? s.current+1 : diff>1 ? 1 : s.current;
      }
      s.lastDate = dateStr;
      if (s.current > s.best) s.best = s.current;
      saveState();
    }

    /* ================================================================
       PR TRACKING
       ================================================================ */
    function checkPR(exercise, set) {
      const e1RM = estimate1RM(set.weight, set.reps);
      const best = Math.max(0,...(APP_STATE.data.prs||[]).filter(p=>p.exerciseId===exercise.id).map(p=>p.estimated1RM||0));
      if (e1RM > best) {
        APP_STATE.data.prs.push({ id:uid(), exerciseId:exercise.id, date:todayKey(), reps:set.reps, weight:set.weight, estimated1RM:e1RM });
        set.isPR = true;
        showToast("Neuer PR");
        haptic();
        saveState();
      }
    }

    /* ================================================================
       RECOVERY
       ================================================================ */
    function decayRecovery() {
      const now = new Date();
      for (const [m, d] of Object.entries(APP_STATE.data.recovery?.byMuscle||{})) {
        const diff = Math.floor((now-new Date(d.lastTrained))/(1000*60*60*24));
        d.fatigue = Math.max(0, 1 - diff*0.2);
      }
    }

    function updateRecovery(workout) {
      for (const ex of workout.exercises) {
        const db = EXERCISE_DB.find(e=>e.name===ex.name);
        if (!db) continue;
        for (const m of [db.muscleGroup,...(db.secondaryMuscles||[])]) {
          APP_STATE.data.recovery.byMuscle[m] = { lastTrained:todayKey(), fatigue:1 };
        }
      }
    }

    function getRecoverySuggestion() {
      const muscles = Object.values(APP_STATE.data.recovery?.byMuscle||{});
      const high = muscles.filter(m=>m.fatigue>0.7).length;
      return high>=3
        ? { type:"rest",  msg:"Heute wäre ein guter Rest Day 🛌" }
        : { type:"train", msg:"Recovery sieht gut aus" };
    }

    function getRecommendedSplit() {
      const r = APP_STATE.data.recovery?.byMuscle||{};
      const scores = { push:(r.Chest?.fatigue||0), pull:(r.Back?.fatigue||0), legs:(r.Legs?.fatigue||0) };
      return Object.entries(scores).sort((a,b)=>a[1]-b[1])[0][0];
    }

    /* ================================================================
       REST TIMER — FIX: clearInterval at start of startRestTimer
       ================================================================ */
    const REST = { active:false, paused:false, endsAt:null, duration:90, remainingMs:0, setId:null };
    let restIntervalId = null;

    function startRestTimer(setId, seconds=90) {
      // FIX: Always clear existing timer first to prevent race conditions
      clearInterval(restIntervalId);
      restIntervalId = null;

      REST.active      = true;
      REST.paused      = false;
      REST.setId       = setId;
      REST.duration    = seconds;
      REST.remainingMs = seconds * 1000;
      REST.endsAt      = Date.now() + (seconds * 1000);

      renderRestTimer();
      restIntervalId = setInterval(tickRest, 250);
    }

    function stopRestTimer() {
      clearInterval(restIntervalId);
      restIntervalId = null;
      REST.active = false;
      REST.paused = false;
      renderRestTimer();
    }

    function tickRest() {
      if (REST.paused) return;
      REST.remainingMs = Math.max(0, REST.endsAt - Date.now());
      if (REST.remainingMs <= 0) {
        stopRestTimer();
        showToast("Rest beendet");
        haptic(20);
        return;
      }
      updateRestUI();
    }

    function updateRestUI() {
      const ms  = REST.active ? (REST.paused ? REST.remainingMs : Math.max(0, REST.endsAt - Date.now())) : 0;
      const sec = Math.ceil(ms / 1000);
      const mm  = String(Math.floor(sec/60)).padStart(2,"0");
      const ss  = String(sec%60).padStart(2,"0");
      const timeStr = `${mm}:${ss}`;
      const pct = REST.duration > 0 ? ((REST.duration*1000-(REST.active?ms:0))/(REST.duration*1000))*100 : 0;

      // Bar
      const bar = document.getElementById("rest-bar");
      const barTime = document.getElementById("rest-bar-time");
      if (bar) { bar.classList.toggle("hidden", !REST.active); }
      if (barTime) barTime.textContent = timeStr;

      // Overlay
      const overlay = document.getElementById("rest-overlay");
      const overlayTime = document.getElementById("rest-overlay-time");
      const overlayEx   = document.getElementById("rest-overlay-exercise");
      const ring = document.getElementById("rest-ring");
      const pauseBtn = document.getElementById("rest-pause-btn");
      if (overlay)  overlay.classList.toggle("hidden", !REST.active);
      if (overlayTime) overlayTime.textContent = timeStr;
      if (overlayEx)   overlayEx.textContent = findExerciseForSet(REST.setId);
      if (ring)     ring.style.setProperty("--rp", String(Math.max(0,Math.min(100,pct)).toFixed(1)));
      if (pauseBtn) pauseBtn.textContent = REST.paused ? "Resume" : "Pause";
    }

    function findExerciseForSet(setId) {
      for (const ex of APP_STATE.today?.exercises||[]) {
        if ((ex.setsData||[]).some(s=>s.id===setId)) return ex.name;
      }
      return "Exercise";
    }

    function initRestTimerButtons() {
      document.getElementById("rest-bar-close")?.addEventListener("click",()=>{ stopRestTimer(); showToast("Timer gestoppt"); haptic(); });
      document.getElementById("rest-pause-btn")?.addEventListener("click",()=>{
        REST.paused = !REST.paused;
        if (!REST.paused) REST.endsAt = Date.now() + REST.remainingMs;
        updateRestUI(); haptic();
      });
      document.getElementById("rest-skip-btn")?.addEventListener("click",()=>{ stopRestTimer(); showToast("Rest übersprungen"); haptic(); });
      document.getElementById("rest-close-btn")?.addEventListener("click",()=>{ stopRestTimer(); haptic(); });
    }

    /* ================================================================
       MODAL / SHEET — SCROLL LOCK
       ================================================================ */
    let modalLocks=0, savedScrollY=0;
    function lockScroll() {
      if (modalLocks===0) {
        savedScrollY = window.scrollY;
        document.body.classList.add("modal-open");
        Object.assign(document.body.style,{position:"fixed",top:`-${savedScrollY}px`,left:"0",right:"0",width:"100%"});
      }
      modalLocks++;
    }
    function unlockScroll(force=false) {
      modalLocks = force ? 0 : Math.max(0,modalLocks-1);
      if (modalLocks!==0) return;
      document.body.classList.remove("modal-open");
      Object.assign(document.body.style,{position:"",top:"",left:"",right:"",width:""});
      window.scrollTo(0, savedScrollY);
    }
    function forceCloseSheets() {
      document.querySelectorAll(".sheet-backdrop").forEach(el=>el.remove());
      unlockScroll(true);
    }

    function openSheet({title, subtitle="", content, onClose}) {
      const root = document.getElementById("sheet-root");
      if (!root) return { close() {} };
      lockScroll();

      const backdrop = document.createElement("div");
      backdrop.className = "sheet-backdrop";

      const sheet = document.createElement("div");
      sheet.className = "sheet";
      sheet.innerHTML = `
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <div class="sheet-title">${title}</div>
          <button class="sheet-close" aria-label="Close">✕</button>
        </div>
        ${subtitle ? `<div class="sheet-subtitle">${subtitle}</div>` : ""}
        <div class="sheet-content-inner"></div>
      `;
      sheet.querySelector(".sheet-content-inner").appendChild(content);
      backdrop.appendChild(sheet);
      root.appendChild(backdrop);

      requestAnimationFrame(()=>backdrop.classList.add("open"));

      let closed=false, dragging=false, startY=0, curY=0, velY=0, lastY=0, lastT=0, sheetH=0;
      const handle = sheet.querySelector(".sheet-handle");
      const head   = sheet.querySelector(".sheet-head");

      function close() {
        if (closed) return; closed=true;
        cleanup();
        backdrop.classList.remove("open");
        backdrop.classList.add("closing");
        setTimeout(()=>{ backdrop.remove(); unlockScroll(); onClose?.(); },260);
      }

      function onDragStart(e) {
        if (e.target?.closest("button,input,textarea,select,a")) return;
        dragging=true; startY=e.clientY; curY=0; velY=0; lastY=e.clientY; lastT=performance.now();
        sheetH=sheet.getBoundingClientRect().height;
        sheet.style.transition="none";
        sheet.setPointerCapture?.(e.pointerId);
      }
      function onDragMove(e) {
        if (!dragging||closed) return;
        const raw=e.clientY-startY;
        let next=raw<0?raw*0.28:raw>Math.max(240,sheetH)?Math.max(240,sheetH)+(raw-Math.max(240,sheetH))*0.14:raw;
        const now=performance.now(); const dt=Math.max(1,now-lastT);
        velY=(e.clientY-lastY)/dt; lastY=e.clientY; lastT=now;
        curY=next; sheet.style.transform=`translateY(${next}px)`;
        const progress=Math.max(0,Math.min(1,next/Math.max(160,sheetH*0.6)));
        backdrop.style.setProperty("--sheet-backdrop-opacity",(0.64-progress*0.38).toFixed(3));
      }
      function onDragEnd(e) {
        if (!dragging||closed) return; dragging=false;
        sheet.releasePointerCapture?.(e.pointerId);
        if (curY+velY*90 > Math.min(220,sheetH*0.36)||velY>0.7) { close(); return; }
        sheet.style.transition="transform 220ms var(--spring)";
        sheet.style.transform="translateY(0)";
      }
      function onKeyDown(e) { if(e.key==="Escape"){e.preventDefault();close();} }
      function onBackdrop(e) { if(e.target===backdrop) close(); }

      const cleanup=()=>{
        document.removeEventListener("keydown",onKeyDown);
        backdrop.removeEventListener("click",onBackdrop);
        sheet.querySelector(".sheet-close")?.removeEventListener("click",close);
        handle?.removeEventListener("pointerdown",onDragStart);
        head?.removeEventListener("pointerdown",onDragStart);
        sheet.removeEventListener("pointermove",onDragMove);
        sheet.removeEventListener("pointerup",onDragEnd);
        sheet.removeEventListener("pointercancel",onDragEnd);
      };

      document.addEventListener("keydown",onKeyDown);
      backdrop.addEventListener("click",onBackdrop);
      sheet.querySelector(".sheet-close")?.addEventListener("click",close);
      handle?.addEventListener("pointerdown",onDragStart);
      head?.addEventListener("pointerdown",onDragStart);
      sheet.addEventListener("pointermove",onDragMove);
      sheet.addEventListener("pointerup",onDragEnd);
      sheet.addEventListener("pointercancel",onDragEnd);

      return { close };
    }

    /* ================================================================
       SWIPE + LONG PRESS
       ================================================================ */
    function enableSwipe(card, {onLeft, onRight}) {
      let startX=0, curX=0, dragging=false, lastX=0, lastT=0, velX=0;
      card.addEventListener("pointerdown",e=>{
        dragging=true; startX=e.clientX; curX=0; lastX=startX; lastT=performance.now(); velX=0;
        card.style.transition="none";
        card.setPointerCapture(e.pointerId);
      });
      card.addEventListener("pointermove",e=>{
        if(!dragging)return;
        const raw=e.clientX-startX;
        const resist=1-Math.min(0.4,Math.abs(raw)/540);
        curX=raw*resist;
        const now=performance.now(), dt=Math.max(1,now-lastT);
        velX=(e.clientX-lastX)/dt; lastX=e.clientX; lastT=now;
        const tilt=Math.max(-3.5,Math.min(3.5,curX/22));
        const scale=1-Math.min(0.018,Math.abs(curX)/1900);
        card.style.transform=`translateX(${curX}px) rotate(${tilt}deg) scale(${scale})`;
        if(Math.abs(curX)>18) card.classList.add("swiping");
      });
      function reset() {
        dragging=false; curX=0;
        card.style.transition="transform 230ms var(--spring)";
        card.style.transform="translateX(0) rotate(0deg) scale(1)";
        setTimeout(()=>{ card.style.transition=""; card.style.transform=""; },250);
        card.classList.remove("swiping");
      }
      card.addEventListener("pointerup",e=>{
        if(!dragging)return;
        const proj=curX+velX*110;
        if(proj<-82) { haptic(); card.style.transition="transform 160ms var(--spring)"; card.style.transform="translateX(-110px) scale(0.96)"; onLeft?.(); }
        else if(proj>82) { haptic(); card.style.transition="transform 160ms var(--spring)"; card.style.transform="translateX(110px) scale(0.96)"; onRight?.(); }
        reset();
      });
      card.addEventListener("pointercancel",reset);
    }

    function enableLongPress(el, cb, ms=700) {
      let timer=null;
      const clear=()=>{ clearTimeout(timer); el.classList.remove("hold-delete"); };
      el.addEventListener("pointerdown",()=>{ el.classList.add("hold-delete"); timer=setTimeout(()=>{ haptic(20); cb(); clear(); },ms); });
      el.addEventListener("pointerup",clear);
      el.addEventListener("pointerleave",clear);
      el.addEventListener("pointercancel",clear);
    }

    function animateCount(el, target, {dur=900,suffix="",decimals=0}={}) {
      if(!el)return; const start=performance.now();
      const frame=now=>{ const p=Math.min((now-start)/dur,1); const e=1-Math.pow(1-p,3);
        el.textContent=(0+(target-0)*e).toFixed(decimals)+suffix;
        if(p<1)requestAnimationFrame(frame); };
      requestAnimationFrame(frame);
    }

    /* ================================================================
       ROUTER
       ================================================================ */
    const ROUTES = { home:renderHome, workout:renderWorkout, history:renderHistory, stats:renderStats, settings:renderSettings };
    let currentRoute = "home";
    let navBound = false, resizeBound = false;

    function navigate(route) {
      if (!ROUTES[route]) return;
      const container = document.getElementById("app-page");
      const old = container.firstElementChild;
      const next = document.createElement("div");
      next.className="page"; next.dataset.route=route;
      ROUTES[route](next);
      applyMotion(next,route);
      if(old) {
        old.classList.add("page-leave");
        next.classList.add("page-enter");
        container.appendChild(next);
        old.addEventListener("animationend",()=>{ old.remove(); next.classList.remove("page-enter"); },{once:true});
      } else { container.appendChild(next); }
      currentRoute=route;
      window.dispatchEvent(new CustomEvent("gym:routeChanged",{detail:{route}}));
    }

    function applyMotion(page, route) {
      const sel=".home-topbar,.hero-card,.section-block,.next-workout-card,.exercise-card,.glass-card,.settings-group,.workout-progress-bar,.motivation-card,.health-card";
      page.querySelectorAll(sel).forEach((el,i)=>{

          if(a==="plan")        { openGeneratorSheet(); return; }
          if(a==="exercises")   { openQuickAddSheet(); return; }
          if(a==="progress")    { navigate("stats"); return; }
          if(a==="settings")    { navigate("settings"); return; }
          if(a==="notifications"){ await requestNotifPermission(); return; }
          if(a==="recovery")    { showToast(getRecoverySuggestion().msg); return; }
          if(a==="calendar")    { navigate("history"); return; }
          if(a==="nutrition")   { showToast("Nutrition tracking in Planung"); return; }
          if(a==="open-workout"){ navigate("workout"); return; }
        });
      });
    }

    function renderNextWorkoutCard(root, today) {
      const img = workoutImg(today?.type||today?.label||"push");
      if (!today.exercises.length) {
        root.innerHTML = `
          <div class="next-workout-card glass-card" style="border-radius:var(--r-lg)">
            ${mediaImg(img)}
            <div class="card-overlay"></div>
            <div class="nw-title">${t("workout.pushDay")}</div>
            <div class="nw-meta">${t("workout.none")}</div>
            <button class="btn-primary" data-action="start-next-workout">${t("workout.create")}</button>
          </div>`;
        root.querySelector("[data-action='start-next-workout']")?.addEventListener("click",()=>{ haptic(); openGeneratorSheet(); });
        return;
      }
      const groups = inferGroups(today);
      const groupLabel = groups.length ? groups.join(" · ") : "Chest · Shoulders · Triceps";
      root.innerHTML = `
        <div class="next-workout-card glass-card" style="border-radius:var(--r-lg)">
          ${mediaImg(img)}
          <div class="card-overlay"></div>
          <div class="nw-title">${today.label||t("workout.pushDay")}</div>
          <div class="nw-meta">${groupLabel}</div>
          <div class="nw-pills">
            <div class="nw-pill">${today.exercises.length} ${t("workout.exercises")}</div>
            <div class="nw-pill">${getSets(today.exercises[0])} ${t("workout.sets")}</div>
            <div class="nw-pill">${Math.round(today.volume||0).toLocaleString(numLocale())} kg</div>
          </div>
          <button class="btn-primary" data-action="start-next-workout">${t("workout.start")}</button>
        </div>`;
      root.querySelector("[data-action='start-next-workout']")?.addEventListener("click",()=>{ haptic(); navigate("workout"); });
    }

    function inferGroups(day) {
      const groups=[];
      for(const ex of day?.exercises||[]) {
        const db=EXERCISE_DB.find(e=>e.name===ex.name);
        const label=db?.muscleGroup||ex.tag||"Body";
        if(label&&!groups.includes(label)) groups.push(label);
      }
      return groups.slice(0,3);
    }

    function getSetProgress(day) {
      let total=0,done=0;
      for(const ex of day?.exercises||[]) { for(const s of ex.setsData||[]) { total++; if(s.done)done++; } }
      return { total, done, percent: total ? Math.round(done/total*100) : 0 };
    }

    /* ================================================================
       WORKOUT PAGE — optimized set updates
       ================================================================ */
    const expandedDoneEx = new Set();

    function renderWorkout(root) {
      const today   = APP_STATE.today;
      const progress= getSetProgress(today);
      const groups  = inferGroups(today);
      const subtitle= groups.length ? groups.join(" · ") : "Chest · Shoulders · Triceps";

      root.innerHTML = `
        <div class="page-header section-block">
          <div class="t-hero" style="font-size:clamp(24px,6vw,30px)">${today.label||"Push Day"}</div>
          <div class="t-small" style="margin-top:3px;color:rgba(255,255,255,0.55)">${subtitle}</div>
        </div>

        <div class="section-block">
          <div class="section-header">
            <span class="t-section">Aktives Workout</span>
            <span class="t-micro">${today.date}</span>
          </div>

          <div class="workout-header-actions" style="margin-bottom:10px">
            <button class="timer-btn" data-secs="30"><i data-lucide="timer"></i><span>30s</span></button>
            <button class="timer-btn" data-secs="60"><i data-lucide="timer"></i><span>60s</span></button>
            <button class="timer-btn" data-secs="90"><i data-lucide="timer"></i><span>90s</span></button>
            <button class="timer-btn-primary" data-action="custom-timer"><i data-lucide="clock-3"></i><span>Timer</span></button>
            <button class="timer-clock-btn" data-action="default-rest" title="Standard-Pause" aria-label="Standard-Pause"><i data-lucide="settings-2"></i></button>
          </div>

          <div class="workout-progress-bar glass-card" style="border-radius:var(--r-md);padding:10px 14px">
            <div class="wp-head">
              <span>Fortschritt</span>
              <strong id="wp-text">${progress.done}/${progress.total} Sätze</strong>
            </div>
            <div class="wp-track"><div class="wp-fill" id="wp-fill" style="width:${progress.percent}%"></div></div>
          </div>

          <div id="exercise-list"></div>
        </div>

        <div class="section-block" style="position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px);z-index:5">
          <button class="btn-primary" data-action="finish-workout">${today.completed ? "Zusammenfassung anzeigen" : progress.done && progress.done === progress.total ? "Workout abschließen" : "Workout starten"}</button>
        </div>

        <div class="section-block">
          <div class="section-header"><span class="t-section">Notizen</span></div>
          <p class="t-small" style="color:var(--c-text-2)">${today.notes||"Kurze Notiz zu deinem heutigen Training."}</p>
        </div>
      `;

      renderExerciseList(root.querySelector("#exercise-list"), today);
      requestAnimationFrame(renderIcons);

      root.querySelectorAll("[data-secs]").forEach(btn=>{
        btn.addEventListener("click",()=>{ const s=Number(btn.dataset.secs); startRestTimer("quick-"+s,s); haptic(); showToast(`Timer ${s}s gestartet`); });
      });
      root.querySelector("[data-action='custom-timer']")?.addEventListener("click",()=>openCustomTimerSheet());
      root.querySelector("[data-action='default-rest']")?.addEventListener("click",()=>openDefaultRestSheet());
      root.querySelector("[data-action='finish-workout']")?.addEventListener("click",()=>{
        haptic();
        if (!today.exercises.length) { openGeneratorSheet(); return; }
        if (!today.startedAt) {
          markWorkoutStarted(today);
          showToast("Workout läuft");
          renderWorkout(root);
          return;
        }
        openWorkoutCompletionSheet(today);
      });
    }

    /* ---- OPTIMIZED renderExerciseList: does NOT wipe DOM for set state updates ---- */
    function renderExerciseList(root, day) {
      if (!root) return;
      root.innerHTML = "";
      if (!day.exercises.length) {
        root.innerHTML = `<div class="empty-state glass-card"><div class="empty-icon"><i data-lucide="dumbbell"></i></div><div class="empty-title">Keine Übungen</div><div class="empty-sub">Bereit für dein nächstes Training.</div><button class="btn-primary" data-action="empty-add">Workout erstellen</button></div>`;
        root.querySelector("[data-action='empty-add']")?.addEventListener("click",()=>openGeneratorSheet());
        requestAnimationFrame(renderIcons);
        return;
      }
      day.exercises.forEach((ex,i)=>{ normalizeExercise(ex); root.appendChild(buildExerciseCard(ex,i,day,root)); });
      requestAnimationFrame(renderIcons);
    }

    /* Build a single exercise card — all set updates happen in-place */
    function buildExerciseCard(ex, idx, day, listRoot) {
      const done      = isDone(ex);
      const collapsed = done && !expandedDoneEx.has(ex.id);
      const doneSets  = (ex.setsData||[]).filter(s=>s.done).length;
      const total     = Math.max(1,(ex.setsData||[]).length);
      const pct       = Math.round(doneSets/total*100);
      const nextSetId = (ex.setsData||[]).find(s=>!s.done)?.id;
      const overload  = getOverloadSuggestion(ex, day.date);

      const card = document.createElement("article");
      card.className="exercise-card glass-card";
      card.style.borderRadius="var(--r-lg)";
      card.dataset.exIdx=idx;
      card.innerHTML=`
        <div class="exercise-side">
          <div class="exercise-status-ring${done?" done":""}" id="ex-ring-${idx}">${pct}%</div>
          <span class="exercise-tag" id="ex-tag-${idx}">${done?"Done":(ex.tag||"Active")}</span>
        </div>
        <div class="exercise-main">
          <div class="exercise-name">${ex.name}</div>
          <div class="exercise-meta">${getSets(ex)} Sets · ${getReps(ex)} Reps · ${getWeight(ex)} kg</div>
          <div class="overload-card">
            <div class="overload-title"><i data-lucide="trending-up"></i>${overload.title}</div>
            <div class="overload-copy">${overload.copy}</div>
          </div>
          <div class="exercise-actions">
            <button class="ex-btn" data-action="history" data-idx="${idx}" title="Verlauf" aria-label="Verlauf"><i data-lucide="history"></i><span class="ex-btn-label">Verlauf</span></button>
            <button class="ex-btn" data-action="edit"    data-idx="${idx}" title="Bearbeiten" aria-label="Bearbeiten"><i data-lucide="sliders-horizontal"></i><span class="ex-btn-label">Bearbeiten</span></button>
            <button class="ex-btn" data-action="note"    data-idx="${idx}" title="Notiz" aria-label="Notiz"><i data-lucide="notebook-pen"></i><span class="ex-btn-label">Notiz</span></button>
            <button class="ex-btn ex-btn-primary" data-action="complete-set" data-idx="${idx}" title="Satz fertig" aria-label="Satz fertig"><i data-lucide="check"></i><span class="ex-btn-label">Satz fertig</span></button>
            ${done?`<button class="ex-btn" data-action="toggle-sets" data-idx="${idx}" title="${collapsed?"Aufklappen":"Zuklappen"}" aria-label="${collapsed?"Aufklappen":"Zuklappen"}"><i data-lucide="${collapsed?"chevron-down":"chevron-up"}"></i><span class="ex-btn-label">${collapsed?"Aufklappen":"Zuklappen"}</span></button>`:""}
          </div>
          <div class="set-list-wrap${collapsed?" collapsed":""}" id="set-wrap-${idx}">
            <div class="set-list-inner">
              <div class="set-list" id="set-list-${idx}"></div>
            </div>
          </div>
        </div>
      `;

      // Populate sets
      const setListEl = card.querySelector(`#set-list-${idx}`);
      (ex.setsData||[]).forEach(set=>{
        setListEl.appendChild(buildSetCard(set,ex,day,idx,set.id===nextSetId,listRoot));
      });

      // Exercise action events
      card.querySelector("[data-action='toggle-sets']")?.addEventListener("click",()=>{
        if(expandedDoneEx.has(ex.id)) expandedDoneEx.delete(ex.id); else expandedDoneEx.add(ex.id);
        refreshExerciseCard(card,ex,idx,day,listRoot);
      });
      card.querySelector("[data-action='edit']")?.addEventListener("click",()=>openEditExSheet(day,idx,listRoot));
      card.querySelector("[data-action='note']")?.addEventListener("click",()=>openNoteSheet(day,idx));
      card.querySelector("[data-action='history']")?.addEventListener("click",()=>openHistorySheet(ex.name));
      card.querySelector("[data-action='complete-set']")?.addEventListener("click",()=>{
        const set = ex.setsData?.find(s=>!s.done);
        if(!set){ showToast("Alle Sätze erledigt"); return; }
        markWorkoutStarted(day);
        set.done=true;
        checkPR(ex,set);
        const restSecs = APP_STATE.data.preferences.defaultRestSeconds||set.restSeconds||90;
        startRestTimer(set.id, restSecs);
        haptic();
        showToast(isDone(ex)?"Übung abgeschlossen":`Satz fertig · ${restSecs}s Pause`);
        recalcWorkout(day);
        recalcStats();
        saveState();
        // FIX: Update only this card in-place, no full list rebuild
        refreshExerciseCard(card,ex,idx,day,listRoot);
        updateProgressBar(day);
      });

      return card;
    }

    /* Refresh a single exercise card in-place — avoids full DOM rebuild */
    function refreshExerciseCard(card, ex, idx, day, listRoot) {
      const done      = isDone(ex);
      const collapsed = done && !expandedDoneEx.has(ex.id);
      const doneSets  = (ex.setsData||[]).filter(s=>s.done).length;
      const total     = Math.max(1,(ex.setsData||[]).length);
      const pct       = Math.round(doneSets/total*100);
      const nextSetId = (ex.setsData||[]).find(s=>!s.done)?.id;

      // Ring
      const ring=card.querySelector(`#ex-ring-${idx}`);
      if(ring){ ring.textContent=`${pct}%`; ring.classList.toggle("done",done); }
      // Tag
      const tag=card.querySelector(`#ex-tag-${idx}`);
      if(tag) tag.textContent=done?"Done":(ex.tag||"Active");
      // Collapse
      const wrap=card.querySelector(`#set-wrap-${idx}`);
      if(wrap) wrap.classList.toggle("collapsed",collapsed);
      // Sets
      const setList=card.querySelector(`#set-list-${idx}`);
      if(setList) {
        setList.innerHTML="";
        (ex.setsData||[]).forEach(set=>{
          setList.appendChild(buildSetCard(set,ex,day,idx,set.id===nextSetId,listRoot));
        });
      }
      // Toggle button
      const actRow=card.querySelector(".exercise-actions");
      if(actRow) {
        let toggleBtn=actRow.querySelector("[data-action='toggle-sets']");
        if(done && !toggleBtn) {
          toggleBtn=document.createElement("button");
          toggleBtn.className="ex-btn"; toggleBtn.dataset.action="toggle-sets"; toggleBtn.dataset.idx=idx;
          toggleBtn.title=collapsed?"Aufklappen":"Zuklappen";
          toggleBtn.setAttribute("aria-label",collapsed?"Aufklappen":"Zuklappen");
          toggleBtn.innerHTML=`<i data-lucide="${collapsed?"chevron-down":"chevron-up"}"></i><span class="ex-btn-label">${collapsed?"Aufklappen":"Zuklappen"}</span>`;
          toggleBtn.addEventListener("click",()=>{
            if(expandedDoneEx.has(ex.id)) expandedDoneEx.delete(ex.id); else expandedDoneEx.add(ex.id);
            refreshExerciseCard(card,ex,idx,day,listRoot);
          });
          actRow.appendChild(toggleBtn);
        } else if(toggleBtn) {
          toggleBtn.title=collapsed?"Aufklappen":"Zuklappen";
          toggleBtn.setAttribute("aria-label",collapsed?"Aufklappen":"Zuklappen");
          toggleBtn.innerHTML=`<i data-lucide="${collapsed?"chevron-down":"chevron-up"}"></i><span class="ex-btn-label">${collapsed?"Aufklappen":"Zuklappen"}</span>`;
        }
      }
      renderIcons();
    }

    function updateProgressBar(day) {
      const p=getSetProgress(day);
      const fill=document.getElementById("wp-fill");
      const text=document.getElementById("wp-text");
      if(fill) fill.style.width=`${p.percent}%`;
      if(text) text.textContent=`${p.done}/${p.total} Sätze`;
    }

    function buildSetCard(set, ex, day, exIdx, isNext, listRoot) {
      const card=document.createElement("div");
      card.className=`set-card${set.done?" done":isNext?" next":""}`;
      card.dataset.setId=set.id;
      const setNum=(ex.setsData||[]).findIndex(s=>s.id===set.id)+1;
      card.innerHTML=`
        <div class="set-swipe-bg">
          <div class="swipe-hint swipe-left"><i data-lucide="check"></i> Fertig</div>
          <div class="swipe-hint swipe-right"><i data-lucide="sliders-horizontal"></i> Bearbeiten</div>
        </div>
        <div class="set-content">
          <div style="flex:1;min-width:0">
            <div class="set-label">Set ${setNum}</div>
            <div class="set-grid">
              <div class="set-kv"><div class="set-k">Gewicht</div><div class="set-v">${set.weight}kg</div></div>
              <div class="set-kv"><div class="set-k">Reps</div><div class="set-v">${set.reps}</div></div>
              <div class="set-kv"><div class="set-k">RIR</div><div class="set-v">${set.rir??"-"}</div></div>
              <div class="set-kv"><div class="set-k">PR</div><div class="set-v">${set.isPR?"Best":"-"}</div></div>
            </div>
            <div class="set-meta-row">
              <span class="set-rest"><i data-lucide="timer"></i>${set.restSeconds}s</span>
              ${set.done?`<span class="set-done-badge">Done</span>`:""}
              ${set.isPR?`<span class="set-pr-badge">PR</span>`:""}
            </div>
          </div>
          <div class="set-status-icon">${set.done?`<i data-lucide="circle-check"></i>`:""}</div>
        </div>
      `;

      // Long press to delete
      enableLongPress(card,()=>openDeleteSetSheet(set,ex,day,card,listRoot));

      // Swipe
      enableSwipe(card,{
        onLeft:()=>{
          if(set.done) return;
          markWorkoutStarted(day);
          set.done=true;
          checkPR(ex,set);
          const restSecs=APP_STATE.data.preferences.defaultRestSeconds||90;
          startRestTimer(set.id,restSecs);
          haptic();
          showToast(isDone(ex)?"Übung abgeschlossen":"Satz fertig");
          recalcWorkout(day); recalcStats(); saveState();
          // FIX: refresh just the parent exercise card
          const exCard=listRoot?.querySelector(`[data-ex-idx="${exIdx}"]`);
          const wrapper=card.closest("article[data-ex-idx]");
          if(wrapper) refreshExerciseCard(wrapper,ex,exIdx,day,listRoot);
          updateProgressBar(day);
        },
        onRight:()=>openEditSetSheet(set,ex,day,listRoot,exIdx),
      });

      return card;
    }

    /* ================================================================
       WORKOUT SHEETS
       ================================================================ */
    function openEditExSheet(day, idx, listRoot) {
      const ex=day.exercises[idx];
      if(!ex) return;
      const firstSet=ex.setsData?.[0]||{reps:8,weight:0};
      const content=document.createElement("div");
      content.innerHTML=`
        <div class="sheet-row"><input class="sheet-input" data-f="name" value="${ex.name}" placeholder="Übungsname" /></div>
        <div class="sheet-row">
          <input class="sheet-input" type="number" data-f="sets" value="${getSets(ex)}" placeholder="Sätze" />
          <input class="sheet-input" type="number" data-f="reps" value="${firstSet.reps}" placeholder="Reps" />
          <input class="sheet-input" type="number" data-f="weight" value="${firstSet.weight}" placeholder="kg" />
        </div>
        <div class="sheet-row">
          <button class="sheet-btn-danger" data-action="delete">Löschen</button>
          <button class="sheet-btn-primary" data-action="save">Speichern</button>
        </div>
      `;
      const {close}=openSheet({title:"Übung bearbeiten",content});
      const v=sel=>content.querySelector(sel)?.value?.trim();
      content.querySelector("[data-action='delete']")?.addEventListener("click",()=>{
        const removed=deepClone(day.exercises[idx]);
        day.exercises.splice(idx,1);
        recalcWorkout(day); recalcStats(); saveState(); close();
        showUndoToast("Übung gelöscht",()=>{ day.exercises.splice(idx,0,deepClone(removed)); recalcWorkout(day); saveState(); renderExerciseList(listRoot,day); updateProgressBar(day); });
        renderExerciseList(listRoot,day); updateProgressBar(day);
      });
      content.querySelector("[data-action='save']")?.addEventListener("click",()=>{
        ex.name=v("[data-f='name']")||ex.name;
        const desired=Math.max(1,safeNumber(v("[data-f='sets']"),getSets(ex)));
        const reps=safeNumber(v("[data-f='reps']"),getReps(ex));
        const weight=safeNumber(v("[data-f='weight']"),getWeight(ex));
        while(ex.setsData.length<desired) ex.setsData.push(createSet({reps,weight}));
        if(ex.setsData.length>desired) ex.setsData=ex.setsData.slice(0,desired);
        ex.setsData.forEach(s=>{ s.reps=reps; s.weight=weight; });
        recalcWorkout(day); recalcStats(); saveState(); close();
        showToast("Übung gespeichert");
        renderExerciseList(listRoot,day); updateProgressBar(day);
      });
    }

    function openWorkoutCompletionSheet(workout) {
      const preview = summarizeWorkout(workout);
      const content=document.createElement("div");
      content.className="finish-panel";
      content.innerHTML=`
        <div class="summary-grid">
          <div class="summary-card"><div class="summary-label">Volumen</div><div class="summary-value">${preview.volume.toLocaleString(numLocale())} kg</div></div>
          <div class="summary-card"><div class="summary-label">Dauer</div><div class="summary-value">${preview.duration} min</div></div>
          <div class="summary-card"><div class="summary-label">Sätze</div><div class="summary-value">${preview.doneSets}/${preview.sets}</div></div>
          <div class="summary-card"><div class="summary-label">Score</div><div class="summary-value">${preview.score.toLocaleString(numLocale())}</div></div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Muskeln</div>
          <div class="summary-value" style="font-size:14px">${preview.groups.length ? preview.groups.join(" · ") : "Ganzkörper"}</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">PRs</div>
          <div class="finish-pr-list">
            ${preview.prs.length
              ? preview.prs.map(pr=>`<div class="finish-pr-row"><span>${getExerciseNameById(pr.exerciseId)}</span><strong>${pr.weight} kg x ${pr.reps}</strong></div>`).join("")
              : `<div class="t-small">Keine neuen PRs in diesem Workout.</div>`
            }
          </div>
        </div>
        <div class="sheet-row">
          <button class="sheet-btn-secondary" data-action="history">Historie</button>
          <button class="sheet-btn-primary" data-action="complete">${workout.completed ? "Gespeichert" : "Abschließen"}</button>
        </div>
      `;
      const {close}=openSheet({title:"Workout-Zusammenfassung",subtitle:workout.label || "Workout",content});
      content.querySelector("[data-action='history']")?.addEventListener("click",()=>{ close(); navigate("history"); });
      content.querySelector("[data-action='complete']")?.addEventListener("click",()=>{
        const summary = completeWorkout(workout);
        if (!summary) return;
        showToast("Workout abgeschlossen");
        close();
        navigate("history");
      });
    }

    function getExerciseNameById(exerciseId) {
      for (const workout of APP_STATE.data.workouts || []) {
        const ex = (workout.exercises || []).find(item => item.id === exerciseId);
        if (ex) return ex.name;
      }
      return "Übung";
    }

    function openEditSetSheet(set,ex,day,listRoot,exIdx) {
      const content=document.createElement("div");
      content.innerHTML=`
        <div class="sheet-row">
          <input class="sheet-input" type="number" value="${set.reps}" data-f="reps" placeholder="Reps" />
          <input class="sheet-input" type="number" value="${set.weight}" data-f="weight" placeholder="kg" />
        </div>
        <div class="sheet-row">
          <input class="sheet-input" type="number" value="${set.rir??""}" data-f="rir" placeholder="RIR (optional)" />
          <input class="sheet-input" type="number" value="${set.restSeconds}" data-f="rest" placeholder="Pause (s)" />
        </div>
        <div class="sheet-row">
          <button class="sheet-btn-secondary" data-cancel>Abbrechen</button>
          <button class="sheet-btn-primary" data-save>Speichern</button>
        </div>
      `;
      const {close}=openSheet({title:"Set bearbeiten",subtitle:ex.name,content});
      content.querySelector("[data-cancel]")?.addEventListener("click",close);
      content.querySelector("[data-save]")?.addEventListener("click",()=>{
        set.reps=safeNumber(content.querySelector("[data-f='reps']").value,set.reps);
        set.weight=safeNumber(content.querySelector("[data-f='weight']").value,set.weight);
        const rir=content.querySelector("[data-f='rir']").value.trim();
        set.rir=rir!==""?safeNumber(rir,set.rir ?? 0):null;
        set.restSeconds=safeNumber(content.querySelector("[data-f='rest']").value,set.restSeconds);
        recalcWorkout(day); saveState(); close();
        showToast("Set gespeichert");
        const exCard=listRoot?.querySelector(`article[data-ex-idx="${exIdx}"]`);
        if(exCard) refreshExerciseCard(exCard,ex,exIdx,day,listRoot);
      });
    }

    function openDeleteSetSheet(set,ex,day,card,listRoot) {
      const content=document.createElement("div");
      content.innerHTML=`
        <div class="sheet-row" style="margin-bottom:16px">

        haptic();
        card.classList.add("removing");

        setTimeout(()=>{
          if(i>=0) ex.setsData.splice(i,1);
          recalcWorkout(day); saveState(); close();

          updateProgressBar(day);

      const recommended=getRecommendedSplit();

      content.appendChild(header);

      for(const tmpl of APP_STATE.data.workoutTemplates) {
        const wrap=document.createElement("div");
        wrap.className="gen-template";
        wrap.innerHTML=`
          <button class="gen-template-btn" data-tmpl="${tmpl.id}" style="--tc:${tmpl.color}">
            ${mediaImg(workoutImg(tmpl.type),"",{})}

              </div>
            </div>
            ${tmpl.favorite?`<div class="gen-fav"><i data-lucide="star"></i></div>`:""}
          </button>
          <div class="gen-actions">
            <button class="gen-action-btn" data-rename="${tmpl.id}" title="Umbenennen" aria-label="Umbenennen"><i data-lucide="pencil"></i></button>
            <button class="gen-action-btn" data-duplicate="${tmpl.id}" title="Duplizieren" aria-label="Duplizieren"><i data-lucide="copy"></i></button>
            <button class="gen-action-btn" data-fav="${tmpl.id}" title="Favorit" aria-label="Favorit"><i data-lucide="${tmpl.favorite?"star":"star"}"></i></button>
            <button class="gen-action-btn" data-del="${tmpl.id}" title="Löschen" aria-label="Löschen"><i data-lucide="trash-2"></i></button>
          </div>
        `;
        content.appendChild(wrap);
      }

      const {close}=openSheet({title:"Workout Generator",subtitle:"Trainingstag wählen oder Übung hinzufügen",content});
      requestAnimationFrame(renderIcons);

      content.querySelector("[data-action='add-manual']")?.addEventListener("click",()=>{ close(); openQuickAddSheet(); });
      content.querySelector("[data-action='add-template']")?.addEventListener("click",()=>{ close(); openCreateTemplateSheet(); });

      content.querySelectorAll("[data-tmpl]").forEach(btn=>{
        btn.addEventListener("click",()=>{
          const tmpl=APP_STATE.data.workoutTemplates.find(t=>t.id===btn.dataset.tmpl);
          if(!tmpl)return;
          const goal=tmpl.type==="pull"?"strength":"hypertrophy";
          const repsBase=goal==="strength"?[3,6]:[8,12];
          const exercises=tmpl.exercises.map(name=>({
            id:uid(), name, tag:tmpl.type,
            setsData:Array.from({length:4},()=>createSet({reps:repsBase[0]+Math.floor(Math.random()*(repsBase[1]-repsBase[0]+1)),weight:40})),
          }));
          APP_STATE.today.exercises.push(...exercises);
          APP_STATE.today.label=tmpl.name;
          recalcWorkout(APP_STATE.today); recalcStats(); saveState();
          showToast(`${tmpl.name} geladen`); close();
          if(currentRoute==="workout"){ const l=document.getElementById("exercise-list"); if(l)renderExerciseList(l,APP_STATE.today); updateProgressBar(APP_STATE.today); }
        });
      });
      content.querySelectorAll("[data-del]").forEach(btn=>btn.addEventListener("click",()=>{
        if(APP_STATE.data.workoutTemplates.length<=1){showToast("Mindestens 1 Template");return;}
        const id=btn.dataset.del;
        const tmpl=APP_STATE.data.workoutTemplates.find(t=>t.id===id);
        if(!tmpl)return;
        APP_STATE.data.workoutTemplates=APP_STATE.data.workoutTemplates.filter(t=>t.id!==id);
        saveState(); close(); showToast("Template gelöscht"); openGeneratorSheet();
      }));
      content.querySelectorAll("[data-rename]").forEach(btn=>btn.addEventListener("click",()=>{
        const id=btn.dataset.rename;
        const tmpl=APP_STATE.data.workoutTemplates.find(t=>t.id===id);
        if(!tmpl)return; close(); renameTemplateSheet(tmpl);
      }));
      content.querySelectorAll("[data-duplicate]").forEach(btn=>btn.addEventListener("click",()=>{
        const id=btn.dataset.duplicate;
        const tmpl=APP_STATE.data.workoutTemplates.find(t=>t.id===id);
        if(!tmpl)return;
        const c={...deepClone(tmpl),id:uid(),name:tmpl.name+" Copy",favorite:false,createdAt:Date.now()};
        APP_STATE.data.workoutTemplates.push(c); saveState(); close(); showToast("Dupliziert"); openGeneratorSheet();
      }));
      content.querySelectorAll("[data-fav]").forEach(btn=>btn.addEventListener("click",()=>{
        const id=btn.dataset.fav;
        const tmpl=APP_STATE.data.workoutTemplates.find(t=>t.id===id);
        if(!tmpl)return; tmpl.favorite=!tmpl.favorite; saveState(); close(); openGeneratorSheet();
      }));
    }

        .sort((a,b) => String(b.workout.date).localeCompare(String(a.workout.date)) || Number(b.workout.completedAt || 0) - Number(a.workout.completedAt || 0));
    }

      return date.toLocaleDateString(numLocale(), { day:"2-digit", month:"short", year:"numeric" });

    function getWeekDayDist() {
      const days=[0,0,0,0,0,0,0];
      (APP_STATE.data.workouts||[]).forEach(w=>{
        if(!w.completed&&!w.exercises?.length) return;
        const d=new Date(w.date);
        if(isNaN(d.getTime()))return;
        days[(d.getDay()+6)%7]++;
      });
      return days;
    }

    function initStatNumbers() {
      const s=APP_STATE.data.stats||{};
      const wv=Math.round((s.weeklyVolumeKg||0)*1000);
      const volEl=document.getElementById("stat-vol");
      if(volEl){ if(wv>=1000) animateCount(volEl,+(wv/1000).toFixed(1),{suffix:"k",decimals:1}); else animateCount(volEl,wv,{suffix:" kg"}); }
      animateCount(document.getElementById("stat-ses"),s.weeklySessions||0);
      const scr=s.weeklyScore||0;
      animateCount(document.getElementById("stat-scr"),scr>=1000?+(scr/1000).toFixed(1):scr,scr>=1000?{suffix:"k",decimals:1}:{});
      animateCount(document.getElementById("stat-prs"),(APP_STATE.data.prs||[]).length);
      const trendEl=document.getElementById("stat-trend");
      if(trendEl) trendEl.textContent=getMonthTrend();
    }

    function getScoreSeries() {
      if(statsRange==="week") return { labels:["Mo","Di","Mi","Do","Fr","Sa","So"], data:(APP_STATE.data.stats?.weeklyScoreSeries||buildWeekScoreSeries(APP_STATE.data.workouts||[])) };
      if(statsRange==="year") {
        const bkts=Array.from({length:12},()=>0);
        (APP_STATE.data.workouts||[]).forEach(w=>{ const d=new Date(w.date); if(!isNaN(d.getTime())) bkts[d.getMonth()]+=(w.score||0); });
        return {labels:["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"],data:bkts};
      }
      if(statsRange==="all") {
        const m=new Map(); (APP_STATE.data.workouts||[]).forEach(w=>{ const d=new Date(w.date); if(isNaN(d.getTime()))return; const y=String(d.getFullYear()); m.set(y,(m.get(y)||0)+(w.score||0)); });
        const labs=[...m.keys()].sort(); return {labels:labs.length?labs:[String(new Date().getFullYear())],data:labs.map(l=>m.get(l))};
      }
      const md=APP_STATE.data.stats?.monthlyScoreSeries||buildMonthScoreSeries(APP_STATE.data.workouts||[]);
      return {labels:md.map((_,i)=>String(i+1)),data:md};
    }

    function calcMonthVol() {
      const today=new Date(), start=new Date(today.getFullYear(),today.getMonth(),1);
      return (APP_STATE.data.workouts||[]).filter(w=>{const d=new Date(w.date);return d>=start&&d<=today;}).reduce((a,w)=>a+(w.volume||0),0);
    }
    function calcMonthSessions() {
      const today=new Date(), start=new Date(today.getFullYear(),today.getMonth(),1);
      return new Set((APP_STATE.data.workouts||[]).filter(w=>{const d=new Date(w.date);return (w.completed||w.exercises?.length)&&d>=start&&d<=today;}).map(w=>w.date)).size;
    }
    function getMonthTrend() {
      const md=APP_STATE.data.stats?.monthlySeries||[];
      const half=Math.floor(md.length/2);
      const f=md.slice(0,half).reduce((a,v)=>a+v,0);
      const s=md.slice(half).reduce((a,v)=>a+v,0);
      if(!f)return "–"; if(s>f*1.05)return "↗ steigt"; if(s<f*0.95)return "↘ sinkt"; return "→ stabil";
    }

    /* Muscle distribution */
    function getMuscleDistrib() {
      const totals={Chest:0,Back:0,Legs:0,Shoulders:0,Arms:0};
      const all=[...(APP_STATE.data.workouts||[]),...(APP_STATE.today?.exercises?.length?[{exercises:APP_STATE.today.exercises}]:[])];
      all.forEach(w=>(w.exercises||[]).forEach(ex=>{
        const load=Math.max(0.01,Math.sqrt(getSets(ex)*getReps(ex)*Math.max(1,getWeight(ex))));
        const prof=getMuscleProfile(ex);
        Object.entries(prof).forEach(([m,v])=>{ if(totals[m]!==undefined) totals[m]+=load*v; });
      }));
      const total=Object.values(totals).reduce((a,v)=>a+v,0);
      const lbls={Chest:"Brust",Back:"Rücken",Legs:"Beine",Shoulders:"Schultern",Arms:"Arme"};
      if(!total) return Object.entries({Chest:28,Back:25,Legs:22,Shoulders:15,Arms:10}).map(([k,p])=>({key:k,label:lbls[k],percent:p}));
      const raw=Object.entries(totals).map(([k,v])=>({key:k,label:lbls[k],pct:v/total*100})).sort((a,b)=>b.pct-a.pct);
      const floored=raw.map(x=>({...x,percent:Math.floor(x.pct)}));
      let rem=100-floored.reduce((a,x)=>a+x.percent,0);
      floored.sort((a,b)=>(b.pct-Math.floor(b.pct))-(a.pct-Math.floor(a.pct))).forEach((x,i)=>{if(i<rem)x.percent++;});
      return floored.sort((a,b)=>b.percent-a.percent);
    }

    function getMuscleProfile(ex) {
      const n=String(ex?.name||"").toLowerCase();
      const db=EXERCISE_DB.find(e=>e.name===ex?.name);
      const p={Chest:0,Back:0,Legs:0,Shoulders:0,Arms:0};
      if(db?.muscleGroup in p) p[db.muscleGroup]+=1;
      (db?.secondaryMuscles||[]).forEach(m=>{
        const ml=m.toLowerCase();
        if(ml.includes("shoulder")||ml.includes("delt")) p.Shoulders+=0.45;
        if(ml.includes("tricep")||ml.includes("bicep")) p.Arms+=0.45;
      });
      if(!Object.values(p).some(Boolean)){
        if(/bench|press|fly/.test(n)) p.Chest+=1;
        if(/row|pulldown|pull/.test(n)) p.Back+=1;
        if(/squat|leg|deadlift|calf/.test(n)) p.Legs+=1;
        if(/shoulder|lateral|delt/.test(n)) p.Shoulders+=1;
        if(/curl|tricep|bicep|pushdown/.test(n)) p.Arms+=1;
      }
      if(!Object.values(p).some(Boolean)){p.Chest=0.28;p.Back=0.25;p.Legs=0.22;p.Shoulders=0.15;p.Arms=0.1;}
      return p;
    }

    function getMuscleHighlights() {
      const maps={Chest:new Map(),Back:new Map(),Legs:new Map(),Shoulders:new Map(),Arms:new Map()};
      const all=[...(APP_STATE.data.workouts||[]),...(APP_STATE.today?.exercises?.length?[{exercises:APP_STATE.today.exercises}]:[])];
      all.forEach(w=>(w.exercises||[]).forEach(ex=>{
        const name=String(ex?.name||"").trim(); if(!name)return;
        const load=Math.max(0.01,Math.sqrt(getSets(ex)*getReps(ex)*Math.max(1,getWeight(ex))));
        const prof=getMuscleProfile(ex);
        Object.entries(prof).forEach(([m,r])=>{ if(!r||!(m in maps))return; maps[m].set(name,(maps[m].get(name)||0)+load*r); });
      }));
      const defs={Chest:["Bench Press","Incline Press","Push-ups"],Back:["Pull-ups","Barbell Row","Lat Pulldown"],Legs:["Squat","Romanian Deadlift","Leg Press"],Shoulders:["Overhead Press","Lateral Raise","Arnold Press"],Arms:["Bicep Curl","Tricep Pushdown","Hammer Curl"]};
      return Object.fromEntries(Object.entries(maps).map(([m,map])=>{
        const top=[...map.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3).map(([n])=>n);
        return [m,top.length?top:defs[m]];
      }));
    }
