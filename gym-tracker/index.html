    function handleSetting(key, root) {
      const prefs=APP_STATE.data.preferences;
      switch(key) {
        case "theme":
          prefs.theme=prefs.theme==="dark"?"light":"dark";
          applyTheme(prefs.theme);
          showToast(`Darstellung: ${prefs.theme==="dark"?t("values.dark"):t("values.light")}`);
          break;
        case "language":
          prefs.language=prefs.language==="de"?"en":"de";
          document.documentElement.setAttribute("lang",prefs.language);
          saveState(); initBottomNav(); navigate(currentRoute); return;
        case "haptics":
          prefs.haptics=!prefs.haptics;
          showToast(`Haptik: ${prefs.haptics?t("values.on"):t("values.off")}`);
          break;
        case "sound":
          prefs.sound=!prefs.sound;
          showToast(`Sound: ${prefs.sound?t("values.on"):t("values.off")}`);
          break;
        case "notifications":
          requestNotifPermission();
          break;
        case "default-rest":
          openDefaultRestSheet();
          return;
        case "export": case "backup":
          exportJSON(); return;
        case "import":
          importJSON(); return;
        case "about": {
          const c=document.createElement("div");
          c.innerHTML=`<div class="sheet-subtitle">Emerald Gym 2026 · Premium Local-First Fitness PWA<br/>Alle Daten bleiben auf deinem Gerät.</div><div class="sheet-row"><button class="sheet-btn-primary" data-close>Schließen</button></div>`;
          const {close}=openSheet({title:"About Emerald Gym",content:c});
          c.querySelector("[data-close]")?.addEventListener("click",close);
          return;
        }
        case "reset":
          if(confirm("Wirklich alles zurücksetzen? Alle Daten gehen verloren.")) {
            localStorage.removeItem(STORAGE_KEY);
            APP_STATE.data=defaultState();
            ensureTodayWorkout();
            showToast("App zurückgesetzt");
            navigate("home");
            return;
          }
          return;
      }
      saveState();
      renderSettings(root);
    }

    function applyTheme(theme) {
      document.documentElement.classList.toggle("theme-dark",theme==="dark");
      document.documentElement.classList.toggle("theme-light",theme==="light");
      const meta=document.querySelector("meta[name='theme-color']");
      if(meta) meta.setAttribute("content",theme==="dark"?"#050608":"#eef4f2");
    }

    function exportJSON() {
      const blob=new Blob([JSON.stringify(APP_STATE.data,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a"); a.href=url; a.download="emerald-gym-backup.json"; a.click();
      URL.revokeObjectURL(url); showToast("Export abgeschlossen");
    }

    function importJSON() {
      const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json";
      inp.addEventListener("change",()=>{
        const f=inp.files[0]; if(!f)return;
        const r=new FileReader();
        r.onload=()=>{
          try {
            const data=JSON.parse(r.result);
            APP_STATE.data={...defaultState(),...data};
            saveState(); ensureTodayWorkout(); showToast("Import erfolgreich"); navigate("home");
          } catch(e) { showToast("Import fehlgeschlagen"); }
        };
        r.readAsText(f);
      });
      inp.click();
    }

    async function requestNotifPermission() {
      if(!("Notification" in window)) { showToast("Benachrichtigungen nicht unterstützt"); return; }
      const perm = await Notification.requestPermission();
      APP_STATE.data.preferences.notifications=perm; saveState();
      showToast(`Benachrichtigungen: ${perm}`);
    }

    /* ================================================================
       BOOTSTRAP
       ================================================================ */
    function bootstrap() {
      loadState();
      ensureTodayWorkout();
      decayRecovery();
      recalcStats();
      applyTheme(APP_STATE.data.preferences.theme);
      document.documentElement.setAttribute("lang",APP_STATE.data.preferences.language);
      initBottomNav();
      initRestTimerButtons();
      initScrollFX();
      navigate("home");
    }

    // Error boundary
    window.addEventListener("error",e=>{console.error("Emerald Error:",e.error);});
    window.addEventListener("unhandledrejection",e=>{console.error(e.reason);});

    // PWA
    let deferredInstall=null;
    window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;});
    if("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("service-worker.js").catch(()=>{});
    }

    bootstrap();
  </script>
</body>
</html>
