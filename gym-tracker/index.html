    let modalLockCount = 0;
    let modalLockedScrollY = 0;

    function lockModalScroll() {
      if (modalLockCount === 0) {
        modalLockedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
        document.body.classList.add("modal-open");
        document.body.style.position = "fixed";
        document.body.style.top = `-${modalLockedScrollY}px`;
        document.body.style.left = "0";
        document.body.style.right = "0";
        document.body.style.width = "100%";
      }
      modalLockCount += 1;
    }

    function unlockModalScroll({ force = false } = {}) {
      if (force) {
        modalLockCount = 0;
      } else {
        modalLockCount = Math.max(0, modalLockCount - 1);
      }

      if (modalLockCount !== 0) return;

      const top = document.body.style.top;
      document.body.classList.remove("modal-open");
      document.body.style.position = "";
      document.body.style.top = "";
      document.body.style.left = "";
      document.body.style.right = "";
      document.body.style.width = "";

      const restoreY = modalLockedScrollY || Math.abs(parseInt(top || "0", 10)) || 0;
      window.scrollTo(0, restoreY);
    }

    function forceCloseAllSheets() {
      const root = document.getElementById("sheet-root");
      if (!root) return;
      root.querySelectorAll(".sheet-backdrop").forEach((node) => node.remove());
      unlockModalScroll({ force: true });

    function openSheet({ title, subtitle, content, onClose }) {
      const root = document.getElementById("sheet-root");
      if (!root) return { close: () => {} };

      lockModalScroll();

      const backdrop = document.createElement("div");
      backdrop.className = "sheet-backdrop";

      const sheet = document.createElement("div");
      sheet.className = "sheet";
      sheet.innerHTML = `
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <div class="sheet-title-wrap">
            <div class="sheet-title">${title}</div>
          </div>
          <button class="sheet-close" type="button" data-action="close-sheet" aria-label="Close sheet">✕</button>
        </div>
        ${subtitle ? `<div class="sheet-subtitle">${subtitle}</div>` : ""}
        <div class="sheet-content"></div>
      `;

      const contentRoot = sheet.querySelector(".sheet-content");
      contentRoot.appendChild(content);

      backdrop.appendChild(sheet);
      root.appendChild(backdrop);

      requestAnimationFrame(() => backdrop.classList.add("is-open"));

      let closed = false;
      let dragging = false;
      let dragStartY = 0;
      let startTranslate = 0;
      let currentTranslate = 0;
      let lastMoveY = 0;
      let lastMoveTs = 0;
      let velocityY = 0;
      let sheetHeight = 0;

      const handle = sheet.querySelector(".sheet-handle");
      const head = sheet.querySelector(".sheet-head");
      const closeButton = sheet.querySelector("[data-action='close-sheet']");

      function updateBackdropOpacity(offsetY = 0) {
        const fadeRange = Math.max(160, sheetHeight * 0.6);
        const progress = Math.max(0, Math.min(1, offsetY / fadeRange));
        const opacity = 0.62 - progress * 0.36;
        backdrop.style.setProperty("--sheet-backdrop-opacity", opacity.toFixed(3));
      }

      function setSheetTranslate(y, withTransition = false) {
        currentTranslate = y;
        if (withTransition) {
          sheet.style.transition = "transform 220ms cubic-bezier(0.22, 1, 0.36, 1)";
        } else {
          sheet.style.transition = "none";
        }
        sheet.style.transform = `translateY(${y}px)`;
        updateBackdropOpacity(Math.max(0, y));
      }

      function snapToNearestDetent(projectedY) {
        const detents = [0, 64];
        const nearest = detents.reduce((acc, value) => {
          return Math.abs(value - projectedY) < Math.abs(acc - projectedY) ? value : acc;
        }, 0);
        setSheetTranslate(nearest, true);
      }

      function cleanup() {
        document.removeEventListener("keydown", onKeyDown);
        backdrop.removeEventListener("click", onBackdropClick);
        closeButton?.removeEventListener("click", onCloseButton);
        handle?.removeEventListener("pointerdown", onDragStart);
        head?.removeEventListener("pointerdown", onDragStart);
        sheet.removeEventListener("pointermove", onDragMove);
        sheet.removeEventListener("pointerup", onDragEnd);
        sheet.removeEventListener("pointercancel", onDragEnd);
      }

      function close() {
        if (closed) return;
        closed = true;
        cleanup();

        backdrop.classList.remove("is-open");
        backdrop.classList.add("is-closing");
        sheet.style.transition = "transform 200ms cubic-bezier(0.4, 0, 1, 1)";
        sheet.style.transform = `translateY(${Math.max(36, sheet.offsetHeight * 0.25)}px)`;

        setTimeout(() => {
          backdrop.remove();
          unlockModalScroll();
          onClose && onClose();
        }, 220);
      }

      function onCloseButton() {
        close();
      }

      function onBackdropClick(e) {
        if (e.target === backdrop) close();
      }

      function onKeyDown(e) {
        if (e.key === "Escape") {
          e.preventDefault();
          close();
        }
      }

      function onDragStart(e) {
        if (closed) return;
        if (e.target?.closest("button, input, textarea, select, a")) return;

        dragging = true;
        dragStartY = e.clientY;
        startTranslate = currentTranslate;
        sheetHeight = sheet.getBoundingClientRect().height;
        lastMoveY = e.clientY;
        lastMoveTs = performance.now();
        velocityY = 0;

        sheet.style.transition = "none";
        sheet.setPointerCapture?.(e.pointerId);
      }

      function onDragMove(e) {
        if (!dragging || closed) return;

        const rawOffset = e.clientY - dragStartY;
        const maxDown = Math.max(260, sheetHeight);
        let nextOffset = startTranslate + rawOffset;

        if (nextOffset < 0) nextOffset *= 0.3;
        if (nextOffset > maxDown) nextOffset = maxDown + (nextOffset - maxDown) * 0.15;

        const now = performance.now();
        const dt = Math.max(1, now - lastMoveTs);
        velocityY = (e.clientY - lastMoveY) / dt;
        lastMoveY = e.clientY;
        lastMoveTs = now;

        setSheetTranslate(nextOffset, false);
      }

      function onDragEnd(e) {
        if (!dragging || closed) return;
        dragging = false;
        sheet.releasePointerCapture?.(e.pointerId);

        const closeThreshold = Math.min(240, sheetHeight * 0.38);
        const projected = currentTranslate + velocityY * 90;

        if (projected > closeThreshold || velocityY > 0.75) {
          close();
          return;
        }

        snapToNearestDetent(projected);
      }

      backdrop.addEventListener("click", onBackdropClick);
      closeButton?.addEventListener("click", onCloseButton);
      document.addEventListener("keydown", onKeyDown);
      handle?.addEventListener("pointerdown", onDragStart);
      head?.addEventListener("pointerdown", onDragStart);
      sheet.addEventListener("pointermove", onDragMove);
      sheet.addEventListener("pointerup", onDragEnd);
      sheet.addEventListener("pointercancel", onDragEnd);

      updateBackdropOpacity(0);

      return { close };
    }

    function initMotionInteractions() {
      const appRoot = document.getElementById("app-root");
      const appPage = document.getElementById("app-page");
      if (!appRoot || !appPage) return;

      let ticking = false;

      function updateScrollMotion() {
        ticking = false;
        const y = Math.max(window.scrollY || 0, document.documentElement.scrollTop || 0);
        const progress = Math.max(0, Math.min(1, y / 260));
        document.documentElement.style.setProperty("--scroll-progress", progress.toFixed(3));
        appRoot.classList.toggle("scrolling", y > 8);

        const hero = appPage.querySelector(".hero-card");
        if (hero) {
          const heroY = Math.max(-10, Math.min(10, -y * 0.06));
          hero.style.setProperty("--hero-move-y", `${heroY}px`);
        }
      }

      function onScroll() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(updateScrollMotion);
      }

      window.addEventListener("scroll", onScroll, { passive: true });
      updateScrollMotion();

      appPage.addEventListener("pointermove", (e) => {
        const hero = e.target.closest(".hero-card");
        if (!hero) return;
        const rect = hero.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;
        const tiltX = (0.5 - y) * 4;
        const tiltY = (x - 0.5) * 5;

        hero.classList.add("is-parallax");
        hero.style.setProperty("--hero-rot-x", `${tiltX.toFixed(2)}deg`);
        hero.style.setProperty("--hero-rot-y", `${tiltY.toFixed(2)}deg`);
        hero.style.setProperty("--hero-move-x", `${(tiltY * 0.45).toFixed(2)}px`);

        const image = hero.querySelector(".hero-image");
        if (image) {
          image.style.transform = `translate3d(${(tiltY * 2.4).toFixed(2)}px, ${(tiltX * -1.8).toFixed(2)}px, 0)`;
        }
      });

      appPage.addEventListener("pointerleave", () => {
        const hero = appPage.querySelector(".hero-card");
        if (!hero) return;
        hero.classList.remove("is-parallax");
        hero.style.setProperty("--hero-rot-x", "0deg");
        hero.style.setProperty("--hero-rot-y", "0deg");
        hero.style.setProperty("--hero-move-x", "0px");
        const image = hero.querySelector(".hero-image");
        if (image) image.style.transform = "translate3d(0, 0, 0)";
      });
    }

      const old = container.firstElementChild;

      next.className = "page";
      next.dataset.route = route;

      render(next);
      animatePageTransition(container, old, next);
      currentRoute = route;
      window.dispatchEvent(new CustomEvent("gym:route-changed", { detail: { route } }));

          if (!template) return;

          const goal = template.type === "pull" ? "strength" : "hypertrophy";
          const exercises = (template.exercises || []).map((exerciseName) => {
            const reps = goal === "strength"
              ? Math.floor(Math.random() * 4) + 3
              : Math.floor(Math.random() * 5) + 8;

            return {
              id: crypto?.randomUUID?.() || uid(),
              name: exerciseName,
              tag: template.type,
              setsData: Array.from({ length: 4 }, () => createSet({ reps, weight: 40 })),
            };
          });

          state.today.exercises.push(...exercises);
          state.today.label = template.name;
          recalcWorkoutVolume(state.today);
            recalcStats();
          saveState();
          showToast(`${template.name} generiert 💪`);
          close();

        });

            if (!template) return;
            close();
            toggleFavoriteTemplate(template);
          };
        });

    function inferMuscleGroupsFromWorkout(day) {
      const groups = [];
      (day?.exercises || []).forEach((exercise) => {
        const dbMatch = (state.data.exerciseDatabase || []).find((entry) => entry.name === exercise.name);
        const label = dbMatch?.muscleGroup || exercise.tag || "Body";
        if (label && !groups.includes(label)) groups.push(label);
      });
      return groups.slice(0, 3);
    }

    function calcWeeklySessions() {
      const today = new Date();
      const start = new Date(today);
      start.setDate(today.getDate() - 6);
      return state.data.workouts.filter(w => {
        const d = new Date(w.date);
        return d >= start && d <= today && w.completed;
      }).length;
    }

    function countPRs() {
      return (state.data.prs && state.data.prs.length) || 0;

    function getWorkoutSetProgress(day) {
      const exercises = day?.exercises || [];
      let total = 0;
      let done = 0;

      exercises.forEach((ex) => {
        normalizeExercise(ex);
        ex.setsData.forEach((set) => {
          total += 1;
          if (set.done) done += 1;
        });
      });

      const percent = total ? Math.round((done / total) * 100) : 0;
      return { total, done, percent };
    }

      if (fill) {
        fill.style.width = `${progress.percent}%`;
      }

      if (text) {
        text.textContent = `${progress.done}/${progress.total} Sätze`;
      }
    }

    function renderExerciseList(root, day) {
      root.innerHTML = "";
      if (!day.exercises.length) {
        root.innerHTML = `<p class="text-muted">Start your first workout to unlock your daily training flow.</p>`;
        return;
      }
      day.exercises.forEach((ex, index) => {
        normalizeExercise(ex);
        const done = isExerciseDone(ex);
        const collapsed = done && !expandedDoneExercises.has(ex.id);
        const nextSetId = ex.setsData?.find(s => !s.done)?.id;
        const doneSets = ex.setsData.filter(s => s.done).length;
        const totalSets = Math.max(1, ex.setsData.length);
        const exercisePercent = Math.round((doneSets / totalSets) * 100);

        const card = document.createElement("article");
        card.className = "exercise-card glass-reflect";
        card.innerHTML = `
          <div class="exercise-main">
            <div class="exercise-name">${ex.name}</div>
            <div class="exercise-meta">${getExerciseSets(ex)} Sets • ${getExerciseReps(ex)} Reps • ${getExerciseWeight(ex)} kg</div>
            <div class="exercise-actions">
              <button data-action="history" data-index="${index}">History</button>
              <button data-action="edit" data-index="${index}">Bearbeiten</button>
              <button data-action="note" data-index="${index}">Notiz</button>
              <button class="is-primary" data-action="complete-set" data-index="${index}">Satz fertig</button>
              ${done
                ? `<button class="is-muted" data-action="toggle-sets" data-index="${index}">${collapsed ? "Aufklappen" : "Zuklappen"}</button>`
                : ""
              }
            </div>
            <div class="set-list-wrap ${collapsed ? "collapsed" : ""}" data-set-wrap="${index}">
              <div class="set-list" data-set-list="${index}"></div>
            </div>
          </div>
          <div class="exercise-side">
            <div class="exercise-status-circle ${done ? "done" : ""}">${exercisePercent}%</div>
            <span class="exercise-tag">${isExerciseDone(ex) ? "Done" : (ex.tag || "Active")}</span>
          </div>
        `;
        root.appendChild(card);

        const setRoot =
          card.querySelector(
            `[data-set-list="${index}"]`
          );

        (ex.setsData || []).forEach(set => {

          renderSetCard(
            set,
            ex,
            day,
            setRoot,
            set.id === nextSetId
          );
        });
      });

      root.querySelectorAll("[data-action='toggle-sets']").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.index);
          const ex = day.exercises[idx];
          if (!ex) return;

          if (expandedDoneExercises.has(ex.id)) {
            expandedDoneExercises.delete(ex.id);
          } else {
            expandedDoneExercises.add(ex.id);
          }

          renderExerciseList(root, day);
        });
      });

        btn.addEventListener("click", () => {

          openHistorySheet(day.exercises[idx].name);
        });

      root.querySelectorAll("[data-action='complete-set']").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.index);
          const ex = day.exercises[idx];
          const set = ex.setsData?.find(s => !s.done);

          if (!set) {
            showToast("Alle Sätze bereits erledigt ✅");
            return;
          }

          set.done = true;

            state.data.preferences?.defaultRestSeconds
            || set.restSeconds
            || 90;

          startRestTimer(
            set.id,
            restSeconds
          );

          hapticLight();

          if (isExerciseDone(ex)) {
            showToast(
              `Übung abgeschlossen ✅ · Pause ${restSeconds}s`
            );
          } else {
            showToast(
              `Satz abgeschlossen 💪 · Pause ${restSeconds}s`
            );
          }

          recalcWorkoutVolume(day);
          recalcStats();
          saveState();
          renderExerciseList(root, day);
        });
      });

      updateWorkoutProgress(day);
    }

      content.innerHTML = `

          Diesen Satz wirklich löschen?

    function openDeleteWorkoutSheet(day) {
      if (!day) return;

      const content = document.createElement("div");
      content.innerHTML = `
        <div class="sheet-subtitle">
          Gesamtes Workout vom ${day.date} löschen?
        </div>
        <div class="sheet-row">
          <button class="sheet-button-secondary" data-cancel>Abbrechen</button>
          <button class="sheet-button-danger" data-delete>Workout löschen</button>
        </div>
      `;

      const { close } = openSheet({
        title: "Workout löschen",
        subtitle: "Alle Übungen und Sätze dieses Tages werden entfernt.",
        content,
      });

      content.querySelector("[data-cancel]").onclick = close;
      content.querySelector("[data-delete]").onclick = () => {
        hapticLight();

        const workoutIndex = state.data.workouts.findIndex(w => w.id === day.id);
        if (workoutIndex < 0) {
          close();
          return;
        }

        const deletedWorkout = deepClone(state.data.workouts[workoutIndex]);
        state.data.workouts.splice(workoutIndex, 1);

        ensureTodayWorkout();
        saveState();
        close();
        showUndoToast("Workout gelöscht", () => {
          const autoCreatedIdx = state.data.workouts.findIndex(
            w =>
              w.date === deletedWorkout.date &&
              w.id !== deletedWorkout.id &&
              !w.completed &&
              (w.exercises?.length || 0) === 0
          );

          if (autoCreatedIdx >= 0) {
            state.data.workouts.splice(autoCreatedIdx, 1);
          }

          const safeIndex = Math.min(workoutIndex, state.data.workouts.length);
          state.data.workouts.splice(safeIndex, 0, deepClone(deletedWorkout));
          state.today = state.data.workouts[safeIndex];
          saveState();
          navigateTo("workout");
          showToast("Workout wiederhergestellt");
        });
        navigateTo("workout");
      };
    }

            weight: desiredWeight,

        if (ex.setsData.length > desiredSets) {

    function getScoreSeriesForRange(range = "month") {
      if (range === "week") {
        const series = state.data.stats?.weeklyScoreSeries;
        return {
          labels: ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"],
          data: Array.isArray(series) && series.length === 7
            ? series
            : buildWeeklyScoreSeries(state.data.workouts || []),
        };
      }

      if (range === "year") {
        const labels = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
        const buckets = Array.from({ length: 12 }, () => 0);
        (state.data.workouts || []).forEach((workout) => {
          const date = new Date(workout.date);
          if (!Number.isNaN(date.getTime())) {
            buckets[date.getMonth()] += (workout.score ?? calcWorkoutScore(workout));
          }
        });
        return { labels, data: buckets };
      }

      if (range === "all") {
        const years = new Map();
        (state.data.workouts || []).forEach((workout) => {
          const date = new Date(workout.date);
          if (Number.isNaN(date.getTime())) return;
          const year = String(date.getFullYear());
          years.set(year, (years.get(year) || 0) + (workout.score ?? calcWorkoutScore(workout)));
        });
        const labels = Array.from(years.keys()).sort();
        const data = labels.map((year) => years.get(year));
        return {
          labels: labels.length ? labels : [String(new Date().getFullYear())],
          data: data.length ? data : [0],
        };
      }

      const monthly = state.data.stats?.monthlyScoreSeries;
      const monthData = Array.isArray(monthly) && monthly.length
        ? monthly
        : buildMonthlyScoreSeries(state.data.workouts || []);
      const labels = monthData.map((_, index) => `${index + 1}`);
      return { labels, data: monthData };
    }

    function calcWeeklyVolume() {
      if (typeof state.data.stats?.weeklyVolumeKg === "number") {
        return Math.round(state.data.stats.weeklyVolumeKg * 1000);
      }

      const today = new Date();
      const start = new Date(today);
      start.setDate(today.getDate() - 6);
      return state.data.workouts
        .filter(w => {
          const d = new Date(w.date);
          return d >= start && d <= today;
        })
        .reduce((acc, w) => acc + (w.volume || 0), 0);
    }

    function calcMonthlyVolume() {
      const fromStats = state.data.stats?.monthlySeries;
      if (Array.isArray(fromStats) && fromStats.length) {
        return fromStats.reduce((acc, v) => acc + (v || 0), 0);
      }

      const today = new Date();
      const start = new Date(today.getFullYear(), today.getMonth(), 1);
      return state.data.workouts
        .filter(w => {
          const d = new Date(w.date);
          return d >= start && d <= today;
        })
        .reduce((acc, w) => acc + (w.volume || 0), 0);
    }

    function calcMonthlySessions() {
      const today = new Date();
      const start = new Date(today.getFullYear(), today.getMonth(), 1);
      const uniqueDates = new Set(
        (state.data.workouts || []).filter(w => {
          if (!w.completed) return false;
          const d = new Date(w.date);
          return d >= start && d <= today;
        }).map(w => w.date)
      );
      return uniqueDates.size;
    }

    function getExerciseMuscleProfile(exercise = {}) {
      const exerciseName = String(exercise?.name || "").toLowerCase();
      const dbEntry = (state.data.exerciseDatabase || []).find((entry) => entry.name === exercise?.name);
      const profile = {
        Chest: 0,
        Back: 0,
        Legs: 0,
        Shoulders: 0,
        Arms: 0,
      };

      function addMuscle(label, amount) {
        if (profile[label] !== undefined) {
          profile[label] += amount;
        }
      }

      if (dbEntry?.muscleGroup === "Chest") addMuscle("Chest", 1);
      if (dbEntry?.muscleGroup === "Back") addMuscle("Back", 1);
      if (dbEntry?.muscleGroup === "Legs") addMuscle("Legs", 1);

      (dbEntry?.secondaryMuscles || []).forEach((muscle) => {
        const normalized = String(muscle).toLowerCase();
        if (normalized.includes("shoulder") || normalized.includes("delt")) addMuscle("Shoulders", 0.45);
        if (normalized.includes("tricep") || normalized.includes("bicep")) addMuscle("Arms", 0.45);
      });

      if (!Object.values(profile).some(Boolean)) {
        if (exerciseName.includes("bench") || exerciseName.includes("press") || exerciseName.includes("fly")) addMuscle("Chest", 1);
        if (exerciseName.includes("row") || exerciseName.includes("pulldown") || exerciseName.includes("pull")) addMuscle("Back", 1);
        if (exerciseName.includes("squat") || exerciseName.includes("leg") || exerciseName.includes("deadlift") || exerciseName.includes("calf")) addMuscle("Legs", 1);
        if (exerciseName.includes("shoulder") || exerciseName.includes("lateral") || exerciseName.includes("delt")) addMuscle("Shoulders", 1);
        if (exerciseName.includes("curl") || exerciseName.includes("tricep") || exerciseName.includes("bicep") || exerciseName.includes("pushdown")) addMuscle("Arms", 1);
      }

      if (!Object.values(profile).some(Boolean)) {
        addMuscle("Chest", 0.28);
        addMuscle("Back", 0.25);
        addMuscle("Legs", 0.22);
        addMuscle("Shoulders", 0.15);
        addMuscle("Arms", 0.1);
      }

      return profile;
    }

    function getMuscleGroupDistribution() {
      const totals = {
        Chest: 0,
        Back: 0,
        Legs: 0,
        Shoulders: 0,
        Arms: 0,
      };

      const workouts = [
        ...(state.data.workouts || []).filter((workout) => Array.isArray(workout?.exercises) && workout.exercises.length),
        ...(state.today?.exercises?.length ? [{ exercises: state.today.exercises }] : []),
      ];

      workouts.forEach((workout) => {
        (workout.exercises || []).forEach((exercise) => {
          const reps = Math.max(1, Number(getExerciseReps(exercise)) || 0);
          const weight = Math.max(1, Number(getExerciseWeight(exercise)) || 0);
          const sets = Math.max(1, Number(getExerciseSets(exercise)) || 0);
          const load = Math.max(0.01, Math.sqrt(sets * reps * weight));
          const profile = getExerciseMuscleProfile(exercise);
          Object.entries(profile).forEach(([muscle, value]) => {
            totals[muscle] += load * value;
          });
        });
      });

      const totalLoad = Object.values(totals).reduce((sum, value) => sum + value, 0);
      const fallback = { Chest: 28, Back: 25, Legs: 22, Shoulders: 15, Arms: 10 };
      if (!totalLoad) {
        return Object.entries(fallback).map(([key, value]) => ({ key, label: ({ Chest: "Brust", Back: "Ruecken", Legs: "Beine", Shoulders: "Schultern", Arms: "Arme" })[key], percent: value }));
      }

      const labelMap = { Chest: "Brust", Back: "Rücken", Legs: "Beine", Shoulders: "Schultern", Arms: "Arme" };
      const rawItems = Object.entries(totals)
        .map(([key, value]) => ({ key, label: labelMap[key], pct: (value / totalLoad) * 100 }))
        .sort((a, b) => b.pct - a.pct);

      // Largest-remainder rounding so total always sums to 100
      const floored = rawItems.map(x => ({ ...x, percent: Math.floor(x.pct) }));
      let remainder = 100 - floored.reduce((s, x) => s + x.percent, 0);
      const withFrac = floored
        .map((x, i) => ({ ...x, frac: rawItems[i].pct - x.percent }))
        .sort((a, b) => b.frac - a.frac);
      withFrac.forEach((x, i) => { if (i < remainder) x.percent += 1; });
      return withFrac.sort((a, b) => b.percent - a.percent);
    }

    function getMuscleGroupExerciseHighlights(limit = 3) {
      const defaults = {
        Chest: ["Bench Press", "Incline Press", "Push-ups"],
        Back: ["Pull-ups", "Barbell Row", "Lat Pulldown"],
        Legs: ["Squat", "Romanian Deadlift", "Leg Press"],
        Shoulders: ["Overhead Press", "Lateral Raise", "Arnold Press"],
        Arms: ["Bicep Curl", "Tricep Pushdown", "Hammer Curl"],
      };

      const totals = {
        Chest: new Map(),
        Back: new Map(),
        Legs: new Map(),
        Shoulders: new Map(),
        Arms: new Map(),
      };

      const workouts = [
        ...(state.data.workouts || []).filter((workout) => Array.isArray(workout?.exercises) && workout.exercises.length),
        ...(state.today?.exercises?.length ? [{ exercises: state.today.exercises }] : []),
      ];

      workouts.forEach((workout) => {
        (workout.exercises || []).forEach((exercise) => {
          const exerciseName = String(exercise?.name || "").trim();
          if (!exerciseName) return;

          const reps = Math.max(1, Number(getExerciseReps(exercise)) || 0);
          const weight = Math.max(1, Number(getExerciseWeight(exercise)) || 0);
          const sets = Math.max(1, Number(getExerciseSets(exercise)) || 0);
          const load = Math.max(0.01, Math.sqrt(sets * reps * weight));
          const profile = getExerciseMuscleProfile(exercise);

          Object.entries(profile).forEach(([muscle, ratio]) => {
            if (!ratio || !totals[muscle]) return;
            totals[muscle].set(exerciseName, (totals[muscle].get(exerciseName) || 0) + (load * ratio));
          });
        });
      });

      return Object.fromEntries(
        Object.entries(totals).map(([muscle, muscleMap]) => {
          const highlights = [...muscleMap.entries()]
            .sort((a, b) => b[1] - a[1])
            .slice(0, limit)
            .map(([exerciseName]) => exerciseName);
          return [muscle, highlights.length ? highlights : defaults[muscle]];
        })
      );
    }

    function getMonthlyWeeklyBuckets() {
      const series = state.data.stats?.monthlySeries || [];
      if (!Array.isArray(series) || !series.length) {
        return [0, 0, 0, 0];
      }

      const buckets = [0, 0, 0, 0];
      series.forEach((value, index) => {
        const bucketIndex = Math.min(3, Math.floor((index / series.length) * 4));
        buckets[bucketIndex] += value || 0;
      });
      return buckets;
    }

    function getMonthlyTrendLabel() {
      const history = (state.data.stats?.monthlySeries || []).filter(v => v > 0);
      if (history.length < 2) return "–";

      const buckets = getMonthlyWeeklyBuckets();
      const firstHalf = buckets[0] + buckets[1];
      const secondHalf = buckets[2] + buckets[3];

      if (!firstHalf && !secondHalf) return "–";
      if (!firstHalf) return "–"; // can't compare to nothing
      if (secondHalf > firstHalf * 1.05) return "↗ steigt";
      if (secondHalf < firstHalf * 0.95) return "↘ sinkt";
      return "→ stabil";
    }

    // =========================
    // SETTINGS PAGE
    // =========================
    function renderSettingsPage(root) {
      const prefs = state.data.preferences;

      root.innerHTML = `
        <div class="page-header">
          <div class="page-title">${t("settings.title")}</div>
          <div class="page-subtitle">${t("settings.subtitle")}</div>
        </div>

        <section class="section-block">
          <div class="settings-group">
            <div class="settings-item" data-setting-row="theme" role="button" tabindex="0" aria-label="${t("settings.appearance")}">
              <span class="settings-label">${t("settings.appearance")}</span>
              <button class="settings-control" data-setting="theme">${prefs.theme === "dark" ? t("values.dark") : t("values.light")}</button>
            </div>
            <div class="settings-item" data-setting-row="language" role="button" tabindex="0" aria-label="${t("settings.language")}">
              <span class="settings-label">${t("settings.language")}</span>
              <button class="settings-control" data-setting="language">${prefs.language.toUpperCase()}</button>
            </div>
            <div class="settings-item" data-setting-row="haptics" role="button" tabindex="0" aria-label="${t("settings.haptics")}">
              <span class="settings-label">${t("settings.haptics")}</span>
              <button class="settings-control" data-setting="haptics">${prefs.haptics ? t("values.on") : t("values.off")}</button>
            </div>
            <div class="settings-item" data-setting-row="sound" role="button" tabindex="0" aria-label="${t("settings.sound")}">
              <span class="settings-label">${t("settings.sound")}</span>
              <button class="settings-control" data-setting="sound">${prefs.sound ? t("values.on") : t("values.off")}</button>
            </div>
            <div class="settings-item" data-setting-row="notifications" role="button" tabindex="0" aria-label="${t("settings.notifications")}">
              <span class="settings-label">${t("settings.notifications")}</span>
              <button class="settings-control" data-setting="notifications">${prefs.notifications}</button>
            </div>
            <div class="settings-item" data-setting-row="default-rest" role="button" tabindex="0" aria-label="${t("settings.defaultRest")}">
              <span class="settings-label">${t("settings.defaultRest")}</span>
              <button class="settings-control" data-setting="default-rest">${prefs.defaultRestSeconds}s</button>
            </div>
          </div>
        </section>

        <section class="section-block">
          <div class="settings-group">
            <div class="settings-item" data-setting-row="export" role="button" tabindex="0" aria-label="${t("settings.dataExport")}">
              <span class="settings-label">${t("settings.dataExport")}</span>
              <button class="settings-control" data-setting="export">JSON</button>
            </div>
            <div class="settings-item" data-setting-row="backup" role="button" tabindex="0" aria-label="${t("settings.backup")}">
              <span class="settings-label">${t("settings.backup")}</span>
              <button class="settings-control" data-setting="backup">${t("values.create")}</button>
            </div>
            <div class="settings-item" data-setting-row="import" role="button" tabindex="0" aria-label="${t("settings.importBackup")}">
              <span class="settings-label">${t("settings.importBackup")}</span>
              <button class="settings-control" data-setting="import">${t("values.restore")}</button>
            </div>
          </div>
        </section>

        <section class="section-block">
          <div class="settings-group">
            <div class="settings-item" data-setting-row="about" role="button" tabindex="0" aria-label="${t("settings.about")}">
              <span class="settings-label">${t("settings.about")}</span>
              <button class="settings-control" data-setting="about">Emerald Gym</button>
            </div>
            <div class="settings-item" data-setting-row="reset" role="button" tabindex="0" aria-label="${t("settings.reset")}">
              <span class="settings-label">${t("settings.reset")}</span>
              <button class="settings-control" data-setting="reset">${t("settings.deleteAll")}</button>
            </div>
          </div>
        </section>
      `;

      root.querySelectorAll("[data-setting]").forEach(btn => {
        btn.addEventListener("click", (event) => {
          event.stopPropagation();
          handleSettingClick(btn.dataset.setting);
        });
      });

      root.querySelectorAll("[data-setting-row]").forEach((row) => {
        const key = row.dataset.settingRow;
        row.addEventListener("click", (event) => {
          if (event.target.closest("[data-setting]")) return;
          handleSettingClick(key);
        });
        row.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            handleSettingClick(key);
          }
        });
      });
    }

    function applyTheme(theme = "dark") {
      const isDark = theme === "dark";
      document.documentElement.classList.toggle("theme-dark", isDark);
      document.documentElement.classList.toggle("theme-light", !isDark);
      const themeMeta = document.querySelector("meta[name='theme-color']");
      if (themeMeta) {
        themeMeta.setAttribute("content", isDark ? "#050608" : "#eef4f2");
      }
    }

    function handleSettingClick(key) {
      const prefs = state.data.preferences;
      switch (key) {
        case "theme":
          prefs.theme = prefs.theme === "dark" ? "light" : "dark";
          applyTheme(prefs.theme);
          showToast(t("toast.appearance", { value: prefs.theme === "dark" ? t("values.dark") : t("values.light") }));
          break;
        case "language":
          prefs.language = prefs.language === "de" ? "en" : "de";
          applyLanguage(prefs.language);
          initBottomNav();
          showToast(t("toast.language", { value: prefs.language.toUpperCase() }));
          navigateTo(currentRoute);
          saveState();
          return;
        case "haptics":
          prefs.haptics = !prefs.haptics;
          showToast(t("toast.haptics", { value: prefs.haptics ? t("values.on") : t("values.off") }));
          break;
        case "sound":
          prefs.sound = !prefs.sound;
          showToast(t("toast.sound", { value: prefs.sound ? t("values.on") : t("values.off") }));
          break;
        case "notifications":
          requestNotificationPermission().then(() => {
            const permission = ("Notification" in window) ? Notification.permission : "n/a";
            prefs.notifications = ["default", "granted", "denied"].includes(permission) ? permission : "default";
            showToast(t("toast.notifications", { value: permission }));
            saveState();
            if (currentRoute === "settings") {
              renderSettingsPage(document.querySelector("#app-page .page[data-route='settings']") || document.getElementById("app-page"));
            }
          });
          break;
        case "default-rest":
          openDefaultRestSheet();
          break;
        case "export":
          exportData();
          break;
        case "backup":
          exportData();
          break;
        case "import":
          importData();
          break;
        case "about": {
          const content = document.createElement("div");
          content.innerHTML = `
            <div class="sheet-subtitle">Emerald Gym 2026 · Premium Local-First Fitness App</div>
            <div class="sheet-row">
              <button class="sheet-button-primary" data-close>Schließen</button>
            </div>
          `;
          const { close } = openSheet({ title: "About", content });
          content.querySelector("[data-close]")?.addEventListener("click", close);
          break;
        }
        case "reset":
          if (confirm("Wirklich alles löschen?")) {
            localStorage.removeItem(STORAGE_KEY);
            state.data = defaultState();
            ensureTodayWorkout();
            showToast("App zurückgesetzt");
            navigateTo("home");
          }
          break;
      }
      saveState();
      if (currentRoute === "settings") {
        renderSettingsPage(document.querySelector("#app-page .page[data-route='settings']") || document.getElementById("app-page"));
      }
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "emerald-gym-backup.json";
      a.click();
      URL.revokeObjectURL(url);
      showToast("Backup exportiert");
    }

    function importData() {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "application/json";
      input.addEventListener("change", () => {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            state.data = { ...defaultState(), ...data };
            saveState();
            ensureTodayWorkout();
            showToast("Backup importiert");
            navigateTo("home");
          } catch (e) {
            showToast("Import fehlgeschlagen");
          }
        };
        reader.readAsText(file);
      });
      input.click();
    }

    // =========================
    // PWA / INSTALL PROMPT (minimal)
    // =========================
    if (
      "serviceWorker" in navigator &&
      location.protocol.startsWith("http")
    ) {
      navigator.serviceWorker.register("service-worker.js").catch(console.error);
    }

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      openPwaInstallSheet();
    });

    // =========================
    // BOOTSTRAP
    // =========================
    function bootstrap() {
      loadState();
      ensureTodayWorkout();
      decayRecovery();
      applyLanguage(state.data.preferences.language);
      applyTheme(state.data.preferences.theme);
      initBottomNav();
      initMotionInteractions();
      initRouter();
    }

    window.addEventListener("error", (e) => {
      console.error("Emerald Error:", e.error);
      showToast("App Fehler erkannt");
    });

    window.addEventListener("unhandledrejection", (e) => {
      console.error(e.reason);
    });

    bootstrap();
  </script>
