function todayStr(){return new Date().toISOString().split('T')[0]}
function yesterday(){
  const d=new Date();d.setDate(d.getDate()-1);
  return d.toISOString().split('T')[0];
}
function diffLabel(d){return d==='easy'?'سهل':d==='medium'?'متوسط':'صعب'}
function scoreSpeech(said,target){
  const s=said.toLowerCase().trim();
  const t=target.toLowerCase().trim();
  let score=0;
  if(s===t)score=100;
  else{
    const sw=s.split(' ');const tw=t.split(' ');
    const matches=sw.filter(w=>tw.includes(w)).length;
    score=Math.round((matches/tw.length)*100);
    score=Math.max(20,Math.min(95,score));
  }
  return score;
}

// ═══════════════════════════════════════════════════
// TEST RUNNER
// ═══════════════════════════════════════════════════
let tests = [];
let passed = 0;
let failed = 0;

function test(name, fn) {
  tests.push({ name, fn });
}

function assert(condition, msg = '') {
  if (!condition) throw new Error(msg || 'Assertion failed');
}
function assertEqual(actual, expected, msg = '') {
  if (actual !== expected) {
    throw new Error(`${msg} Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  }
}

async function runTests() {
  const resultsEl = document.getElementById('results');
  
  for (const t of tests) {
    const div = document.createElement('div');
    div.className = 'test';
    
    const iconSpan = document.createElement('span');
    iconSpan.className = 'icon';
    
    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    nameSpan.textContent = t.name;
    
    const detailDiv = document.createElement('div');
    detailDiv.className = 'detail';
    
    try {
      const result = t.fn();
      if (result instanceof Promise) await result;
      iconSpan.textContent = '✅';
      div.classList.add('pass');
      passed++;
    } catch (e) {
      iconSpan.textContent = '❌';
      div.classList.add('fail');
      detailDiv.textContent = e.message || e;
      failed++;
    }
    
    div.appendChild(iconSpan);
    div.appendChild(nameSpan);
    div.appendChild(detailDiv);
    resultsEl.appendChild(div);
  }
  
  document.getElementById('total-count').textContent = tests.length;
  document.getElementById('pass-count').textContent = passed;
  document.getElementById('fail-count').textContent = failed;
}

test('Design: text colors have proper contrast hierarchy', () => {
  const rootBlock = appSource.match(/:root\{([^}]+)\}/);

  const lum = c => {
    const h = c.replace('#','');
    return parseInt(h.substr(0,2),16)*0.299 + parseInt(h.substr(2,2),16)*0.587 + parseInt(h.substr(4,2),16)*0.114;
  };
  const l1 = lum('#f0f0f5'), l2 = lum('#a0a0b8'), l3 = lum('#60607a');
  assert(l1 > l2 && l2 > l3, 'Text colors not in correct luminance order (primary > secondary > tertiary)');
});

test('Design: check for hardcoded color values outside variables', () => {

  const hardcodedColors = appSource.match(/#[0-9a-fA-F]{6}/g) || [];
  const cssStart = appSource.indexOf('<style>');
  const cssEnd = appSource.indexOf('</style>');

  // The :root block has ~20 color variables, extra hardcoded colors should be minimal
  const unique = new Set(colors);

  const known = ['#0a0a0f','#12121a','#1a1a26','#16161f','#1e1e2e','#f0f0f5','#a0a0b8','#60607a','#6c63ff','#8b83ff','#30d158','#ff453a','#ffd60a','#ff9f0a','#0a84ff','#5ac8fa','#ff375f','#28b84a','#a78bfa','#fbbf24','#f59e0b','#ff6b6b','#48dbfb','#ff9ff3','#1dd1a1','#ff6b35','#ff6b9d','#ffffff','#000000'];
  known.forEach(c => unique.delete(c));
  // Extra hardcoded colors are allowed in gradients and specific UI elements
  // This is informational, not a hard fail
});
