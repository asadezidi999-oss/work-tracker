    function renderExerciseList(root, day) {
      root.innerHTML = "";
      if (!day.exercises.length) {
        root.innerHTML = `<p class="text-muted">Start your first workout to unlock your daily training flow.</p>`;
        return;
      }
      day.exercises.forEach((ex, index) => {
        normalizeExercise(ex);
        const done = isExerciseDone(ex);
        const collapsed = done && !expandedDoneExercises.has(ex.id);
        const nextSetId = ex.setsData?.find(s => !s.done)?.id;
        const doneSets = ex.setsData.filter(s => s.done).length;
        const totalSets = Math.max(1, ex.setsData.length);
        const exercisePercent = Math.round((doneSets / totalSets) * 100);

        const card = document.createElement("article");
        card.className = "exercise-card glass-reflect";
        card.innerHTML = `
          <div class="exercise-main">
            <div class="exercise-name">${ex.name}</div>
            <div class="exercise-meta">${getExerciseSets(ex)} Sets • ${getExerciseReps(ex)} Reps • ${getExerciseWeight(ex)} kg</div>
            <div class="exercise-actions">
              <button data-action="history" data-index="${index}">History</button>
              <button data-action="edit" data-index="${index}">Bearbeiten</button>
              <button data-action="note" data-index="${index}">Notiz</button>
              <button class="is-primary" data-action="complete-set" data-index="${index}">Satz fertig</button>
              ${done
                ? `<button class="is-muted" data-action="toggle-sets" data-index="${index}">${collapsed ? "Aufklappen" : "Zuklappen"}</button>`
                : ""
              }
            </div>
            <div class="set-list-wrap ${collapsed ? "collapsed" : ""}" data-set-wrap="${index}">
              <div class="set-list" data-set-list="${index}"></div>
            </div>
          </div>
          <div class="exercise-side">
            <div class="exercise-status-circle ${done ? "done" : ""}">${exercisePercent}%</div>
            <span class="exercise-tag">${isExerciseDone(ex) ? "Done" : (ex.tag || "Active")}</span>
          </div>
        `;
        root.appendChild(card);

        const setRoot =
          card.querySelector(
            `[data-set-list="${index}"]`
          );

        (ex.setsData || []).forEach(set => {

          renderSetCard(
            set,
            ex,
            day,
            setRoot,
            set.id === nextSetId
          );
        });
      });

      root.querySelectorAll("[data-action='toggle-sets']").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.index);
          const ex = day.exercises[idx];
          if (!ex) return;

          if (expandedDoneExercises.has(ex.id)) {
            expandedDoneExercises.delete(ex.id);
          } else {
            expandedDoneExercises.add(ex.id);
          }

          renderExerciseList(root, day);
        });
      });

      root.querySelectorAll("[data-action='edit']").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.index);
          openEditExerciseSheet(day, idx);
        });
      });

      root.querySelectorAll("[data-action='note']").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.index);
          openNoteSheet(day, idx);
        });
      });

      root.querySelectorAll("[data-action='history']").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.index);
          openHistorySheet(day.exercises[idx].name);
        });
      });

      root.querySelectorAll("[data-action='complete-set']").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.index);
          const ex = day.exercises[idx];
          const set = ex.setsData?.find(s => !s.done);

          if (!set) {
            showToast("Alle Sätze bereits erledigt ✅");
            return;
          }

          set.done = true;

          const restSeconds =
            state.data.preferences?.defaultRestSeconds
            || set.restSeconds
            || 90;

          startRestTimer(
            set.id,
            restSeconds
          );

          hapticLight();

          if (isExerciseDone(ex)) {
            showToast(
              `Übung abgeschlossen ✅ · Pause ${restSeconds}s`
            );
          } else {
            showToast(
              `Satz abgeschlossen 💪 · Pause ${restSeconds}s`
            );
          }

          recalcWorkoutVolume(day);
          recalcStats();
          saveState();
          renderExerciseList(root, day);
        });
      });

      updateWorkoutProgress(day);
    }

    function renderSetCard(
      set,
      ex,
      day,
      root,
      isNext = false
    ) {

      const card =
        document.createElement("div");

      card.className = "set-card glass-reflect";

      if (set.done) {
        card.classList.add("done");
      } else if (isNext) {
        card.classList.add("next");
      }

      card.innerHTML = `

        <div class="set-swipe-bg">
          <div
            class="
              set-swipe-action
              set-swipe-complete
            "
          >
            ✓ Complete
          </div>
          <div
            class="
              set-swipe-action
              set-swipe-edit
            "
          >
            Edit
          </div>
        </div>

        <div class="set-content">

          <div>

            <div class="set-main">
              Set ${Math.max(1, (ex.setsData || []).findIndex((entry) => entry.id === set.id) + 1)}
            </div>

            <div class="set-grid">
              <div class="set-kv">
                <div class="set-k">Weight</div>
                <div class="set-v">${set.weight}kg</div>
              </div>
              <div class="set-kv">
                <div class="set-k">Reps</div>
                <div class="set-v">${set.reps}</div>
              </div>
              <div class="set-kv">
                <div class="set-k">RIR</div>
                <div class="set-v">${set.rir ?? "-"}</div>
              </div>
              <div class="set-kv">
                <div class="set-k">PR</div>
                <div class="set-v">${set.isPR ? "Yes" : "-"}</div>
              </div>
            </div>

            <div class="set-meta-row">
              <div class="set-meta">Rest ${set.restSeconds}s</div>
              ${
                set.done
                  ? `<div class="set-done-badge">Done</div>`
                  : ""
              }
            </div>

          </div>

          <div data-set-status>
            ${set.done ? "✅" : ""}
          </div>

        </div>
      `;

      enableLongPress(
        card,
        () => {
          openDeleteSetSheet(
            set,
            ex,
            day,
            card
          );
        }
      );

      enableSwipe(card, {

        onLeft: () => {

          if (set.done) return;

          set.done = true;

          startRestTimer(
            set.id,
            state.data.preferences.defaultRestSeconds
          );

          hapticLight();

          if (isExerciseDone(ex)) {
            showToast("Übung abgeschlossen ✅");
          } else {
            showToast("Satz abgeschlossen 💪");
          }

          card.classList.add("done");
          const status = card.querySelector("[data-set-status]");
          if (status) status.textContent = "✅";

          hapticLight();

          saveState();

          showToast(
            "Set abgeschlossen 💪"
          );

          if (isExerciseDone(ex)) {
            expandedDoneExercises.add(ex.id);
          }

          const listRoot = document.querySelector("[data-exercise-list]");
          if (listRoot) {
            renderExerciseList(listRoot, day);
          }

          updateWorkoutProgress(day);
        },

        onRight: () => {

          openEditSetSheet(
            set,
            ex,
            day
          );
        },
      });

      root.appendChild(card);
    }

    function openDeleteSetSheet(
      set,
      ex,
      day,
      card
    ) {

      const content =
        document.createElement("div");

      content.innerHTML = `
        <div class="sheet-subtitle">
          Diesen Satz wirklich löschen?
        </div>
        <div class="sheet-row">
          <button
            class="sheet-button-secondary"
            data-cancel
          >
            Abbrechen
          </button>
          <button
            class="sheet-button-danger"
            data-delete
          >
            Löschen
          </button>
        </div>
      `;

      const { close } =
        openSheet({
          title: "Set löschen",
          subtitle:
            "Diese Aktion kann nicht rückgängig gemacht werden.",
          content,
        });

      content
        .querySelector("[data-cancel]")
        .onclick = close;

      content
        .querySelector("[data-delete]")
        .onclick = () => {
          hapticLight();
          card.classList.add(
            "removing"
          );

          const setIndex = ex.setsData.findIndex(s => s.id === set.id);
          const removedSet = setIndex >= 0 ? deepClone(ex.setsData[setIndex]) : null;

          setTimeout(() => {
            if (setIndex < 0) {
              close();
              return;
            }

            ex.setsData.splice(setIndex, 1);
            recalcWorkoutVolume(day);
            saveState();
            close();
            showUndoToast(
              "Set gelöscht",
              () => {
                if (!removedSet) return;
                ex.setsData.splice(setIndex, 0, deepClone(removedSet));
                recalcWorkoutVolume(day);
                saveState();
                navigateTo("workout");
                showToast("Set wiederhergestellt");
              }
            );
            navigateTo(
              "workout"
            );
          }, 180);
        };
    }

    function openDeleteExerciseSheet(day, index) {
      const ex = day.exercises[index];

      const content = document.createElement("div");
      content.innerHTML = `

        </div>

        </div>
      `;

        title: "Übung löschen",
        subtitle: "Die Übung wird aus dem aktuellen Workout entfernt.",

      });

        day.exercises.splice(index, 1);
        recalcWorkoutVolume(day);
        saveState();

          navigateTo("workout");
          showToast("Übung wiederhergestellt");

    function openDeleteWorkoutSheet(day) {
      if (!day) return;

      const content = document.createElement("div");
      content.innerHTML = `
        <div class="sheet-subtitle">
          Gesamtes Workout vom ${day.date} löschen?
        </div>
        <div class="sheet-row">
          <button class="sheet-button-secondary" data-cancel>Abbrechen</button>
          <button class="sheet-button-danger" data-delete>Workout löschen</button>
        </div>
      `;

      const { close } = openSheet({
        title: "Workout löschen",
        subtitle: "Alle Übungen und Sätze dieses Tages werden entfernt.",
        content,
      });

      content.querySelector("[data-cancel]").onclick = close;
      content.querySelector("[data-delete]").onclick = () => {
        hapticLight();

        const workoutIndex = state.data.workouts.findIndex(w => w.id === day.id);
        if (workoutIndex < 0) {
          close();
          return;
        }

        const deletedWorkout = deepClone(state.data.workouts[workoutIndex]);
        state.data.workouts.splice(workoutIndex, 1);

        ensureTodayWorkout();
        saveState();
        close();
        showUndoToast("Workout gelöscht", () => {
          const autoCreatedIdx = state.data.workouts.findIndex(
            w =>
              w.date === deletedWorkout.date &&
              w.id !== deletedWorkout.id &&
              !w.completed &&
              (w.exercises?.length || 0) === 0
          );

          if (autoCreatedIdx >= 0) {
            state.data.workouts.splice(autoCreatedIdx, 1);
          }

          const safeIndex = Math.min(workoutIndex, state.data.workouts.length);
          state.data.workouts.splice(safeIndex, 0, deepClone(deletedWorkout));
          state.today = state.data.workouts[safeIndex];
          saveState();
          navigateTo("workout");
          showToast("Workout wiederhergestellt");
        });
        navigateTo("workout");
      };
    }

          recalcStats();

    function openEditExerciseSheet(day, index) {
      const ex = day.exercises[index];
      const firstSet = ex.setsData?.[0] || { reps: 8, weight: 0 };
      const content = document.createElement("div");
      content.innerHTML = `
        <div class="sheet-row">
          <input class="sheet-input" placeholder="Übung" data-field="name" value="${ex.name}" />
        </div>
        <div class="sheet-row">
          <input class="sheet-input" type="number" placeholder="Sätze" data-field="sets" value="${getExerciseSets(ex)}" />
          <input class="sheet-input" type="number" placeholder="Reps" data-field="reps" value="${firstSet.reps}" />
          <input class="sheet-input" type="number" placeholder="Gewicht (kg)" data-field="weight" value="${firstSet.weight}" />
        </div>
        <div class="sheet-row">
          <button class="sheet-button-secondary" data-action="delete">Löschen</button>
          <button class="sheet-button-primary" data-action="save">Speichern</button>
        </div>
      `;

      const { close } = openSheet({
        title: "Übung bearbeiten",
        subtitle: "",
        content,
      });

      const getVal = (sel) => content.querySelector(sel)?.value?.trim();

      content.querySelector("[data-action='delete']").addEventListener("click", () => {
          recalcStats();
        const removedExercise = deepClone(day.exercises[index]);
        day.exercises.splice(index, 1);
        recalcWorkoutVolume(state.today);
        saveState();

        if (currentRoute === "stats") {

          navigateTo("stats");
        }

        showUndoToast("Übung entfernt", () => {
                    recalcStats();
          day.exercises.splice(index, 0, deepClone(removedExercise));
          recalcWorkoutVolume(day);
          saveState();
          navigateTo("workout");
          showToast("Übung wiederhergestellt");
        });
        if (currentRoute === "workout") {
          const listRoot = document.querySelector("[data-exercise-list]");
          if (listRoot) renderExerciseList(listRoot, day);
        }
        close();
      });

      content.querySelector("[data-action='save']").addEventListener("click", () => {
        ex.name = getVal("[data-field='name']") || ex.name;
        const desiredSets = Math.max(1, Number(getVal("[data-field='sets']") || getExerciseSets(ex) || 1));
        const desiredReps = Number(getVal("[data-field='reps']") || getExerciseReps(ex));
        const desiredWeight = Number(getVal("[data-field='weight']") || getExerciseWeight(ex));

        if (!Array.isArray(ex.setsData) || !ex.setsData.length) {
          ex.setsData = [createSet({
            reps: desiredReps,
            weight: desiredWeight,
          })];
        }

        while (ex.setsData.length < desiredSets) {
          ex.setsData.push(createSet({
            reps: desiredReps,
            weight: desiredWeight,
          }));
        }

        if (ex.setsData.length > desiredSets) {
          ex.setsData = ex.setsData.slice(0, desiredSets);
        }

        ex.setsData.forEach((set) => {
          set.reps = desiredReps;
          set.weight = desiredWeight;
        });

        recalcWorkoutVolume(state.today);
        saveState();

        if (currentRoute === "stats") {

          navigateTo("stats");
        }

        showToast("Übung aktualisiert");
        if (currentRoute === "workout") {
          const listRoot = document.querySelector("[data-exercise-list]");
          if (listRoot) renderExerciseList(listRoot, day);
        }
        close();
      });
    }

    function getVolumeSeriesForRange(range = "month") {
      if (range === "week") {
        return {
          labels: ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"],
          data: getWeeklyVolumeSeries(),
        };
      }

      if (range === "year") {
        const labels = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const buckets = Array.from({ length: 12 }, () => 0);
        (state.data.workouts || []).forEach((workout) => {
          const date = new Date(workout.date);
          if (!Number.isNaN(date.getTime())) {
            buckets[date.getMonth()] += workout.volume || 0;
          }
        });
        return { labels, data: buckets };
      }

      if (range === "all") {
        const years = new Map();
        (state.data.workouts || []).forEach((workout) => {
          const date = new Date(workout.date);
          if (Number.isNaN(date.getTime())) return;
          const year = String(date.getFullYear());
          years.set(year, (years.get(year) || 0) + (workout.volume || 0));
        });
        const labels = Array.from(years.keys()).sort();
        const data = labels.map((year) => years.get(year));
        return {
          labels: labels.length ? labels : [String(new Date().getFullYear())],
          data: data.length ? data : [0],
        };
      }

      const monthly = state.data.stats?.monthlySeries;
      const monthData = Array.isArray(monthly) && monthly.length
        ? monthly
        : buildMonthlySeries(state.data.workouts || []);
      const labels = monthData.map((_, index) => `${index + 1}`);
      return { labels, data: monthData };
    }

    function getFrequencySeriesForRange(range = "month") {
      const volumeSeries = getVolumeSeriesForRange(range);
      return {
        labels: volumeSeries.labels,
        data: volumeSeries.data.map((value) => (value > 0 ? 1 : 0)),
      };
    }

    function calcWeeklyVolume() {
      if (typeof state.data.stats?.weeklyVolumeKg === "number") {
        return Math.round(state.data.stats.weeklyVolumeKg * 1000);
      }

      const today = new Date();
      const start = new Date(today);
      start.setDate(today.getDate() - 6);
      return state.data.workouts
        .filter(w => {
          const d = new Date(w.date);
          return d >= start && d <= today;
        })
        .reduce((acc, w) => acc + (w.volume || 0), 0);
    }

    function calcMonthlyVolume() {
      const fromStats = state.data.stats?.monthlySeries;
      if (Array.isArray(fromStats) && fromStats.length) {
        return fromStats.reduce((acc, v) => acc + (v || 0), 0);
      }

      const today = new Date();
      const start = new Date(today.getFullYear(), today.getMonth(), 1);
      return state.data.workouts
        .filter(w => {
          const d = new Date(w.date);
          return d >= start && d <= today;
        })
        .reduce((acc, w) => acc + (w.volume || 0), 0);
    }

    function calcMonthlySessions() {
      const fromStats = state.data.stats?.monthlySeries;
      if (Array.isArray(fromStats) && fromStats.length) {
        return fromStats.filter((v) => v > 0).length;
      }

      const today = new Date();
      const start = new Date(today.getFullYear(), today.getMonth(), 1);
      return state.data.workouts.filter(w => {
        const d = new Date(w.date);
        return d >= start && d <= today && w.completed;
      }).length;
    }

    function getMonthlyWeeklyBuckets() {
      const series = state.data.stats?.monthlySeries || [];
      if (!Array.isArray(series) || !series.length) {
        return [0, 0, 0, 0];
      }

      const buckets = [0, 0, 0, 0];
      series.forEach((value, index) => {
        const bucketIndex = Math.min(3, Math.floor((index / series.length) * 4));
        buckets[bucketIndex] += value || 0;
      });
      return buckets;
    }

    function getMonthlyTrendLabel() {
      const buckets = getMonthlyWeeklyBuckets();
      const firstHalf = buckets[0] + buckets[1];
      const secondHalf = buckets[2] + buckets[3];

      if (!firstHalf && !secondHalf) {
        return "→ stabil";
      }
      if (secondHalf > firstHalf * 1.05) {
        return "↗ steigt";
      }
      if (secondHalf < firstHalf * 0.95) {
        return "↘ sinkt";
      }
      return "→ stabil";
    }

          document.documentElement.classList.toggle("theme-dark", prefs.theme === "dark");
          showToast(`Appearance: ${prefs.theme === "dark" ? "Dark" : "Light"}`);
          break;
        case "language":
          prefs.language = prefs.language === "de" ? "en" : "de";
          showToast(`Sprache: ${prefs.language.toUpperCase()}`);
          break;
        case "haptics":
          prefs.haptics = !prefs.haptics;
          showToast(`Haptics: ${prefs.haptics ? "Ein" : "Aus"}`);
          break;
        case "sound":
          prefs.sound = !prefs.sound;
          showToast(`Sound: ${prefs.sound ? "Ein" : "Aus"}`);
          break;
        case "notifications":
          requestNotificationPermission().then(() => {
            const permission = ("Notification" in window) ? Notification.permission : "n/a";
            showToast(`Notifications: ${permission}`);
          });
          break;
        case "default-rest":
          openDefaultRestSheet();
          break;

          exportData();
          break;

          exportData();
          break;
        case "import":
          importData();

            ensureTodayWorkout();
            showToast("App zurückgesetzt");

    function exportData() {
      const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "emerald-gym-backup.json";
      a.click();
      URL.revokeObjectURL(url);
      showToast("Backup exportiert");

    function importData() {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "application/json";
      input.addEventListener("change", () => {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            state.data = { ...defaultState(), ...data };
            saveState();
            ensureTodayWorkout();
            showToast("Backup importiert");
            navigateTo("home");
          } catch (e) {
            showToast("Import fehlgeschlagen");
          }
        };
        reader.readAsText(file);
      });
      input.click();
    }

      showToast("App Fehler erkannt");
    });

    window.addEventListener("unhandledrejection", (e) => {
      console.error(e.reason);
    });

    bootstrap();
  </script>
</body>
</html>
